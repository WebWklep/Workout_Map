<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7f7f5">
<title>Workout Map</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f5;
  color: #111;
  font-family: "Courier New", monospace;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#app {
  min-height: 100vh;
  padding: 24px 20px;
}

.hidden {
  display: none !important;
}

/* ГЛАВНЫЙ ЭКРАН */

.topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 38px;
  font-size: 13px;
}

#exerciseList {
  display: flex;
  flex-direction: column;
}

.exercise {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 44px;
  align-items: center;
  gap: 12px;
  padding: 17px 0;
  border-bottom: 1px solid #d8d8d4;
}

.exercise-name {
  font-size: 15px;
  text-align: left;
  overflow-wrap: anywhere;
  padding: 10px 0;
}

.exercise-percent {
  font-size: 13px;
  color: #777;
}

.delete {
  font-size: 20px;
  color: #999;
  width: 44px;
  height: 44px;
}

.add {
  display: block;
  width: 48px;
  height: 48px;
  margin-top: 20px;
  padding: 0;
  font-size: 27px;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  position: relative;
  z-index: 5;
}

/* ЭКРАН КАРТЫ */

.map-header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
}

.back {
  font-size: 23px;
  width: 44px;
  height: 44px;
  text-align: left;
}

.map-title {
  font-size: 14px;
  overflow-wrap: anywhere;
}

.map-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #777;
  margin-bottom: 20px;
}

#maps {
  display: flex;
  flex-direction: column;
  gap: 28px;
  width: 100%;
}

.map svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  touch-action: manipulation;
}

.cell {
  fill: transparent;
}

.cell.filled {
  fill: #111;
}

.outline {
  fill: none;
  stroke: #111;
  stroke-width: 1.15;
  stroke-linejoin: miter;
  vector-effect: non-scaling-stroke;
}

.footer {
  margin-top: 35px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  font-size: 12px;
}
</style>
</head>

<body>

<div id="app">

  <section id="home">

    <div class="topline">
      <span>WORKOUT MAP</span>
      <span id="exerciseCount">00</span>
    </div>

    <div id="exerciseList"></div>

    <button class="add" id="addExercise" type="button">+</button>

  </section>

  <section id="workout" class="hidden">

    <div class="map-header">
      <button class="back" id="back" type="button">←</button>
      <span class="map-title" id="mapTitle"></span>
    </div>

    <div class="map-info">
      <span>MAP PROGRESS</span>
      <span id="mapPercent">0%</span>
    </div>

    <div id="maps"></div>

    <div class="footer">
      <span>REPS</span>
      <span id="totalReps">000</span>
    </div>

  </section>

</div>

<script>
(() => {

const COLS = 22;
const ROWS = 28;
const CELL = 18;

const W = COLS * CELL;
const H = ROWS * CELL;

const KEY = "workout-map-v2";

const home = document.getElementById("home");
const workout = document.getElementById("workout");

const list = document.getElementById("exerciseList");
const mapsEl = document.getElementById("maps");

let currentId = null;

let state = {
  exercises: []
};


/* СОЗДАНИЕ ОСТРОВА */

function randomIsland() {

  const cells = [];

  const cx = (COLS - 1) / 2;
  const cy = (ROWS - 1) / 2;

  const seed = Math.random() * 1000;

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {

      const nx = (x - cx) / (COLS * .49);
      const ny = (y - cy) / (ROWS * .49);

      const angle = Math.atan2(ny, nx);

      const wave =
        .09 * Math.sin(angle * 5 + seed) +
        .055 * Math.sin(angle * 9 - seed * .7) +
        .035 * Math.cos(angle * 13 + seed * .3);

      const radius = Math.sqrt(
        nx * nx * .82 + ny * ny * 1.08
      );

      if (
        radius < .83 + wave &&
        Math.random() > .035
      ) {
        cells.push([x, y, false]);
      }
    }
  }

  return cells;
}


/* КОНТУР КАРТЫ */

function makeOutline(cells) {

  const set = new Set(
    cells.map(c => `${c[0]},${c[1]}`)
  );

  const has = (x, y) =>
    set.has(`${x},${y}`);

  const lines = [];

  for (const [x, y] of cells) {

    const x1 = x * CELL;
    const y1 = y * CELL;
    const x2 = x1 + CELL;
    const y2 = y1 + CELL;

    if (!has(x, y - 1))
      lines.push(`M${x1} ${y1}H${x2}`);

    if (!has(x + 1, y))
      lines.push(`M${x2} ${y1}V${y2}`);

    if (!has(x, y + 1))
      lines.push(`M${x2} ${y2}H${x1}`);

    if (!has(x - 1, y))
      lines.push(`M${x1} ${y2}V${y1}`);
  }

  return lines.join("");
}


/* СОХРАНЕНИЕ */

function save() {

  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch(e) {
    console.log("Ошибка сохранения", e);
  }
}


/* ПРОЦЕНТ ЗАПОЛНЕНИЯ */

function getProgress(exercise) {

  const cells = exercise.maps.flatMap(m => m.cells);

  if (!cells.length) return 0;

  const filled = cells.filter(c => c[2]).length;

  return Math.floor(filled / cells.length * 100);
}


/* ГЛАВНЫЙ ЭКРАН */

function renderHome() {

  list.replaceChildren();

  document.getElementById("exerciseCount").textContent =
    String(state.exercises.length).padStart(2, "0");

  state.exercises.forEach(exercise => {

    const row = document.createElement("div");
    row.className = "exercise";

    const name = document.createElement("button");
    name.className = "exercise-name";
    name.type = "button";
    name.textContent = exercise.name;

    name.onclick = () => openExercise(exercise.id);

    const percent = document.createElement("span");
    percent.className = "exercise-percent";
    percent.textContent = getProgress(exercise) + "%";

    const del = document.createElement("button");
    del.className = "delete";
    del.type = "button";
    del.textContent = "×";
    del.setAttribute("aria-label", "Удалить упражнение");

    del.onclick = () => {

      if (!confirm("Удалить упражнение?")) return;

      state.exercises = state.exercises.filter(
        e => e.id !== exercise.id
      );

      save();
      renderHome();
    };

    row.append(name, percent, del);

    list.appendChild(row);
  });
}


/* ДОБАВЛЕНИЕ УПРАЖНЕНИЯ */

document.getElementById("addExercise").addEventListener("click", () => {

  const name = prompt("Название упражнения:");

  if (!name || !name.trim()) return;

  const exercise = {
    id: Date.now().toString() + Math.random().toString(36).slice(2),
    name: name.trim(),
    reps: 0,
    maps: [
      { cells: randomIsland() }
    ]
  };

  state.exercises.push(exercise);

  save();
  renderHome();
});


/* ОТКРЫТИЕ УПРАЖНЕНИЯ */

function openExercise(id) {

  currentId = id;

  const exercise = getCurrent();

  if (!exercise) return;

  home.classList.add("hidden");
  workout.classList.remove("hidden");

  document.getElementById("mapTitle").textContent =
    exercise.name;

  renderWorkout();
}


/* НАЗАД */

document.getElementById("back").onclick = () => {

  currentId = null;

  workout.classList.add("hidden");
  home.classList.remove("hidden");

  renderHome();
};


/* ТЕКУЩЕЕ УПРАЖНЕНИЕ */

function getCurrent() {

  return state.exercises.find(
    e => e.id === currentId
  );
}


/* ОТРИСОВКА КАРТ */

function renderWorkout() {

  const exercise = getCurrent();

  if (!exercise) return;

  mapsEl.replaceChildren();

  exercise.maps.forEach((map, mapIndex) => {

    const section = document.createElement("div");
    section.className = "map";

    const svg = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );

    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

    map.cells.forEach((cell, i) => {

      const rect = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "rect"
      );

      rect.setAttribute("x", cell[0] * CELL);
      rect.setAttribute("y", cell[1] * CELL);
      rect.setAttribute("width", CELL);
      rect.setAttribute("height", CELL);

      rect.setAttribute(
        "class",
        cell[2] ? "cell filled" : "cell"
      );

      rect.dataset.cell = i;

      svg.appendChild(rect);
    });

    const outline = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    outline.setAttribute("d", makeOutline(map.cells));
    outline.setAttribute("class", "outline");

    svg.appendChild(outline);

    svg.addEventListener("pointerdown", event => {

      const target = event.target.closest("[data-cell]");

      if (!target) return;

      event.preventDefault();

      addRep(mapIndex, Number(target.dataset.cell));
    });

    section.appendChild(svg);
    mapsEl.appendChild(section);
  });

  updateInfo();
}


/* ДОБАВИТЬ ИЛИ ОТМЕНИТЬ ПОВТОРЕНИЕ */

function addRep(mapIndex, cellIndex) {

  const exercise = getCurrent();

  if (!exercise) return;

  const map = exercise.maps[mapIndex];
  const cell = map?.cells[cellIndex];

  if (!cell) return;

  // Если ячейка уже чёрная — отменяем повторение

  if (cell[2]) {

    cell[2] = false;

    exercise.reps = Math.max(
      0,
      exercise.reps - 1
    );

  } else {

    // Если ячейка белая — добавляем повторение

    cell[2] = true;
    exercise.reps++;
  }

  // Обновляем выбранную ячейку

  const svg = mapsEl.children[mapIndex]?.querySelector("svg");

  const rect = svg?.querySelector(
    `[data-cell="${cellIndex}"]`
  );

  if (rect) {
    rect.setAttribute(
      "class",
      cell[2] ? "cell filled" : "cell"
    );
  }

  // Если последняя карта полностью заполнена,
  // добавляем следующую снизу

  const lastMap = exercise.maps[exercise.maps.length - 1];

  if (
    lastMap.cells.every(c => c[2]) &&
    mapIndex === exercise.maps.length - 1
  ) {

    exercise.maps.push({
      cells: randomIsland()
    });

    renderWorkout();
  }

  updateInfo();
  save();
}


/* ОБНОВЛЕНИЕ ИНФОРМАЦИИ */

function updateInfo() {

  const exercise = getCurrent();

  if (!exercise) return;

  document.getElementById("mapPercent").textContent =
    getProgress(exercise) + "%";

  document.getElementById("totalReps").textContent =
    String(exercise.reps).padStart(3, "0");

  save();
}


/* ЗАГРУЗКА СОХРАНЁННЫХ ДАННЫХ */

try {

  const saved = JSON.parse(localStorage.getItem(KEY));

  if (saved && Array.isArray(saved.exercises)) {
    state = saved;
  }

} catch(e) {}


/* ПЕРЕНОС ПРОГРЕССА ИЗ ПРЕДЫДУЩЕЙ ВЕРСИИ */

if (!state.exercises.length) {

  try {

    const old = JSON.parse(
      localStorage.getItem("workout-map-v1")
    );

    if (old && Array.isArray(old.maps)) {

      state.exercises.push({
        id: "old-workout",
        name: "Тренировка",
        reps: old.total || 0,
        maps: old.maps
      });
    }

  } catch(e) {}
}


/* ЗАПУСК */

renderHome();
save();

})();
</script>

</body>
</html>

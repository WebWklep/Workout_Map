<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>CLAIM BY POWER</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --paper: #ffffff;
  --ink: #353430;
  --soft: #85847e;
  --line: #aaa9a2;
  --cell: #55534f;
}

html {
  background: var(--paper);
  overflow-x: hidden;
}

body {
  overflow-x: hidden;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #ffffff;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
}

/* Чистая бумажная основа с очень деликатным печатным зерном */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  opacity: .105;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)' opacity='.34'/%3E%3C/svg%3E");
  background-size: 180px 180px;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#app {
  min-height: 100vh;
  padding: 10px 8px 25px;
  position: relative;
  z-index: 1;
}

.hidden {
  display: none !important;
}

/* ТИПОГРАФИКА */

.topline,
.map-title,
.map-info,
.footer,
.exercise {
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-stretch: normal;
  letter-spacing: -.2px;
}

.topline {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 46px;
  color: #4b4a45;
  text-shadow: none;
}

.brand-lockup {
  display: flex;
  flex-direction: row;
  align-items: baseline;
  justify-content: space-between;
  gap: 0;
  width: 100%;
  line-height: .85;
  white-space: nowrap;
}

.brand-main,
.brand-sub {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(30px, 10.8vw, 54px);
  line-height: .85;
  font-weight: 400;
  letter-spacing: -.075em;
  color: #4b4a45;
}

.brand-sub {
  margin: 0;
  letter-spacing: -.065em;
}

#exerciseCount {
  display: none;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  padding-top: 1px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 19px;
  line-height: .9;
  font-weight: 400;
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
  color: #4b4a45;
}

/* legacy exercise count hidden */
#exerciseCount-old {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  padding-top: 1px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 19px;
  line-height: .9;
  font-weight: 400;
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
  color: #4b4a45;
}

#exerciseCount::after {
  content: "EXERCISES";
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 7px;
  line-height: 1;
  font-weight: 500;
  letter-spacing: .14em;
  color: #96938c;
}

#exerciseList {
  display: flex;
  flex-direction: column;
  width: 100%;
  margin: 0;
  gap: 0;
}

#exerciseList::before { content: none; }

.exercise {
  display: grid;
  grid-template-columns: minmax(0,1fr) 38px;
  align-items: center;
  gap: 12px;
  padding: 0;
  border: 0;
}

.exercise-name {
  font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: .82;
  font-weight: 700;
  letter-spacing: -.085em;
  text-align: left;
  overflow-wrap: anywhere;
  padding: 5px 0;
  color: var(--cell);
  text-transform: uppercase;
  text-shadow: none;
}

.exercise-percent {
  display: block;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 9px;
  font-variant-numeric: tabular-nums;
  letter-spacing: .015em;
  color: #85847e;
  text-align: right;
}

#trainingAtlas {
  display: flex;
  align-items: stretch;
  gap: 5px;
  width: calc(100% + 16px);
  margin: 24px -8px 0;
  padding: 16px 8px 26px;
  overflow-x: auto;
  overflow-y: hidden;
  background: var(--paper);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
#trainingAtlas::-webkit-scrollbar { display: none; }

.atlas-column {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  flex: 0 0 31vw;
  flex-direction: column;
  align-items: stretch;
  min-width: 0;
  gap: 7px;
  padding: 10px 7px 13px;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg,
      rgba(62,58,50,.055) 0%,
      rgba(255,255,255,.18) 7%,
      rgba(255,255,255,.58) 48%,
      rgba(62,58,50,.035) 100%),
    linear-gradient(180deg,
      rgba(255,255,255,.72) 0%,
      rgba(238,235,228,.10) 48%,
      rgba(255,255,255,.52) 100%);
  box-shadow:
    0 3px 9px rgba(52,48,40,.055),
    inset 1px 0 rgba(255,255,255,.9),
    inset -1px 0 rgba(75,70,60,.055);
}
.atlas-column::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .17;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paper'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23paper)' opacity='.22'/%3E%3C/svg%3E");
  background-size: 150px 150px;
  mix-blend-mode: multiply;
}
.atlas-title {
  font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  line-height: .9;
  font-weight: 700;
  letter-spacing: -.075em;
  text-transform: uppercase;
  color: var(--cell);
  overflow-wrap: anywhere;
  text-align: left;
}
.atlas-islands {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
}
.atlas-island {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  cursor: pointer;
}
.atlas-island .cell {
  pointer-events: none;
  fill: transparent;
}
.atlas-island .cell.filled {
  fill: var(--cell);
}
.atlas-island .outline {
  stroke: var(--cell);
}

.row-action {
  display: grid;
  place-items: center;
  width: 38px;
  height: 40px;
  font-size: 20px;
  color: #85847e;
}

.delete {
  font-size: 17px;
  color: #c2c0b9;
}

.edit-title {
  position: absolute;
  top: 18px;
  right: 0;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  margin: 0;
  color: #77766f;
  font-size: 18px;
}

.reroll-map {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #222;
  font-size: 23px;
  line-height: 1;
  box-shadow: none;
  -webkit-appearance: none;
  appearance: none;
}

.map-progress-value {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 0 auto;
}

.home-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 16px;
}
.add {
  display: block;
  width: 40px;
  height: 42px;
  margin: 0;
  padding: 0;
  font-size: 27px;
  color: #65645e;
  text-align: left;
  position: relative;
  z-index: 5;
}
.delete-mode {
  display: grid;
  place-items: center;
  width: 30px;
  height: 36px;
  padding: 0;
  color: #aaa8a1;
  font-size: 19px;
  line-height: 1;
}
.delete-mode.is-active {
  color: var(--cell);
}

/* КАРТА */

#app.view-map {
  padding-left: 4px;
  padding-right: 4px;
}

.map-header {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  margin: 0 4px 28px;
}

.back {
  display: block;
  width: 30px;
  height: 22px;
  padding: 0;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 17px;
  font-weight: 300;
  line-height: 1;
  text-align: left;
  color: #85847e;
}

.map-title {
  font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  font-size: clamp(22px, 6.2vw, 27px);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: -.05em;
  color: #55534e;
  overflow-wrap: anywhere;
  text-shadow: none;
  min-width: 0;
  width: 100%;
  text-align: left;
  line-height: .98;
  padding: 0 46px 0 0;
}

.map-info {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 8px 20px;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 9px;
  font-weight: 500;
  text-transform: uppercase;
  color: #96938c;
  letter-spacing: .085em;
}

.map-progress-value {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: -2px;
}

.reroll-map {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #222;
  font-size: 22px;
  line-height: 1;
  box-shadow: none;
  -webkit-appearance: none;
  appearance: none;
}

.reroll-map:focus,
.reroll-map:active {
  outline: none;
  background: transparent;
}

#maps {
  display: flex;
  flex-direction: column;
  gap: 30px;
  width: 104%;
  margin-left: -2%;
}

.map {
  width: 100%;
  position: relative;
}

.map svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  touch-action: manipulation;
  filter: none;
}

/* КЛЕТКИ */

.cell {
  fill: transparent;
  transition: fill .20s cubic-bezier(.2,.65,.3,1);
}

.cell.filled {
  fill: var(--cell);
}

/* Короткий тактильный отклик клетки при касании */
.cell.is-pressing {
  fill: #bcbab3;
  transition: fill .07s ease-out;
}

.cell.filled.is-pressing {
  fill: #77756f;
}


/* Тихая смена цифр без скачка интерфейса */
.count-change {
  display: inline-block;
  animation: countChange .18s ease-out both;
}

@keyframes countChange {
  0% { opacity: .45; transform: translateY(3px); }
  100% { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .cell,
  .cell.is-pressing,
  .count-change,
  .map.is-entering svg {
    animation: none !important;
    transition: none !important;
  }
}

/* Новая территория спокойно проявляется на бумаге */
.map.is-entering svg {
  transform-origin: center center;
  animation: mapReveal .82s cubic-bezier(.2,.7,.25,1) both;
}

@keyframes mapReveal {
  0% {
    opacity: 0;
    transform: translateY(9px) scale(.994);
    filter: blur(1.4px);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

/* Завершённая территория на мгновение собирается в цельную форму */
.map.just-claimed svg {
  animation: claimSettle .65s ease-out both;
}

.map.just-claimed .cell.filled {
  animation: cellClaim .65s ease-out both;
}

.map.just-claimed .outline {
  animation: outlineClaim .65s ease-out both;
}

@keyframes claimSettle {
  0% { filter: contrast(1); }
  42% { filter: contrast(1.065); }
  100% { filter: contrast(1); }
}

@keyframes cellClaim {
  0% { fill: #77756f; }
  48% { fill: #686660; }
  100% { fill: var(--cell); }
}

@keyframes outlineClaim {
  0% { stroke: var(--cell); stroke-width: .9; opacity: .8; }
  100% { stroke: var(--cell); stroke-width: .62; opacity: 1; }
}

/* КОНТУР */

.outline {
  pointer-events: none;
  fill: none;
  stroke: var(--cell);
  stroke-width: .62;
  stroke-linejoin: miter;
  vector-effect: non-scaling-stroke;
}



.footer {
  position: fixed;
  right: 13px;
  left: auto;
  bottom: max(12px, env(safe-area-inset-bottom));
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  font-family: "Courier New", Courier, monospace;
  font-size: 9px;
  line-height: 1.1;
  font-weight: 400;
  color: #fff;
  letter-spacing: .02em;
  z-index: 20;
  mix-blend-mode: difference;
  pointer-events: none;
}

#totalReps {
  font-family: inherit;
  font-size: 12px;
  line-height: 1.1;
  font-weight: 400;
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
  color: inherit;
}

button:active {
  opacity: .65;
}
</style>
</head>

<body>

<div id="app">

<section id="home">

  <div class="topline">
    <div class="brand-lockup" aria-label="Claim by Power">
      <span class="brand-main">CLAIM</span>
      <span class="brand-sub">BY POWER</span>
    </div>
    <span id="exerciseCount">00</span>
  </div>

  <div id="exerciseList"></div>

  <div class="home-actions">
    <button class="add" id="addExercise" type="button" aria-label="Добавить упражнение">+</button>
    <button class="delete-mode" id="deleteMode" type="button" aria-label="Режим удаления" aria-pressed="false">×</button>
  </div>

  <div id="trainingAtlas" aria-label="Атлас тренировок"></div>

</section>

<section id="workout" class="hidden">

  <div class="map-header">
    <button class="back" id="back" type="button">←</button>
    <span class="map-title" id="mapTitle"></span>
    <button class="edit-title" id="editTitle" type="button" aria-label="Изменить название">✎</button>
  </div>

  <div class="map-info">
    <span>MAP PROGRESS <span id="mapPercent">0%</span></span>
    <button class="reroll-map" id="rerollLargest" type="button" aria-label="Сменить самый большой контур" title="Сменить самый большой контур">⚄</button>
  </div>

  <div id="maps"></div>

  <div class="footer">
    <span class="footer-label">TOTAL REPS</span>
    <span id="totalReps">000</span>
  </div>

</section>

</div>

<script>
(() => {

const COLS = 22;
const ROWS = 28;
const CELL = 18;

const W = COLS * CELL;
const H = ROWS * CELL;

const KEY = "workout-map-v2";

const app = document.getElementById("app");
const home = document.getElementById("home");
const workout = document.getElementById("workout");
const list = document.getElementById("exerciseList");
const mapsEl = document.getElementById("maps");

let currentId = null;
let deleteMode = false;
let audioContext = null;

function playTone(frequency = 520, duration = 0.045, volume = 0.018) {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    audioContext ||= new AudioContextClass();
    if (audioContext.state === "suspended") audioContext.resume();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
    gain.gain.setValueAtTime(volume, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  } catch (e) {}
}

function scrollToNewMap(section) {
  if (!section) return;

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const startY = window.scrollY;
  const targetY = section.getBoundingClientRect().top + startY - 118;
  const distance = targetY - startY;

  if (reducedMotion || Math.abs(distance) < 2) {
    window.scrollTo(0,targetY);
    return;
  }

  const duration = 760;
  const startTime = performance.now();

  function step(now) {
    const progress = Math.min(1,(now-startTime)/duration);
    const eased = 1-Math.pow(1-progress,3);
    window.scrollTo(0,startY+distance*eased);
    if (progress < 1) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

let state = {
  exercises: []
};


/* НОРМАЛИЗАЦИЯ НАЗВАНИЙ */

function starText(text) {
  return String(text).trim().replace(/\s+/g, " ");
}


/* СЛУЧАЙНЫЙ ОСТРОВ */

function randomIsland() {

  // Архитектурный силуэт: крупная ось + смещённые блоки,
  // которые пересекаются и собираются в одну цельную территорию.
  const cells = new Map();
  const rand = (a,b) => a + Math.random() * (b-a);
  const int = (a,b) => Math.floor(rand(a,b+1));

  const vertical = Math.random() < .74;
  const rects = [];

  function addRect(x,y,w,h) {
    rects.push({x,y,w,h});
    for (let yy=y; yy<y+h; yy++) {
      for (let xx=x; xx<x+w; xx++) {
        if (xx >= 1 && xx < COLS-1 && yy >= 1 && yy < ROWS-1) {
          cells.set(`${xx},${yy}`,[xx,yy,false]);
        }
      }
    }
  }

  if (vertical) {
    const spineW = int(4,6);
    const spineH = int(13,17);
    const spineX = int(8, COLS-8-spineW);
    const spineY = int(5, ROWS-5-spineH);
    addRect(spineX,spineY,spineW,spineH);

    // Боковые объёмы разной высоты создают ступенчатый ритм.
    const levels = [
      spineY + int(1,3),
      spineY + int(5,8),
      spineY + spineH - int(4,6)
    ];
    const sides = Math.random() < .5 ? [-1,1] : [1,-1];

    const wingCount = int(2,3);
    for (let i=0;i<wingCount;i++) {
      const side = sides[i % 2];
      const w = int(3,6);
      const h = int(3,6);
      const y = Math.max(2,Math.min(ROWS-h-2,levels[i]));
      const x = side < 0 ? spineX-w+1 : spineX+spineW-1;
      addRect(x,y,w,h);
    }

    // Небольшой сдвинутый верх или цоколь нарушает симметрию.
    if (Math.random() < .78) {
      const w = int(3,6);
      const x = Math.max(2,Math.min(COLS-w-2,spineX+int(-2,spineW-1)));
      const y = Math.random() < .5 ? spineY-int(1,2) : spineY+spineH-1;
      addRect(x,Math.max(2,Math.min(ROWS-4,y)),w,int(3,4));
    }

  } else {
    const spineW = int(13,17);
    const spineH = int(4,6);
    const spineX = int(3, COLS-3-spineW);
    const spineY = int(10, ROWS-7-spineH);
    addRect(spineX,spineY,spineW,spineH);

    const levels = [
      spineX + int(1,3),
      spineX + int(5,8),
      spineX + spineW - int(4,6)
    ];
    const sides = Math.random() < .5 ? [-1,1] : [1,-1];

    const wingCount = int(2,3);
    for (let i=0;i<wingCount;i++) {
      const side = sides[i % 2];
      const w = int(3,6);
      const h = int(3,6);
      const x = Math.max(2,Math.min(COLS-w-2,levels[i]));
      const y = side < 0 ? spineY-h+1 : spineY+spineH-1;
      addRect(x,y,w,h);
    }

    if (Math.random() < .72) {
      const h = int(3,5);
      const y = Math.max(2,Math.min(ROWS-h-2,spineY+int(-2,spineH-1)));
      const x = Math.random() < .5 ? spineX-int(1,2) : spineX+spineW-1;
      addRect(Math.max(2,Math.min(COLS-4,x)),y,int(3,4),h);
    }
  }

  // Один небольшой вырез добавляет характер, не разрушая цельность формы.
  const all = [...cells.values()];
  if (all.length > 85 && Math.random() < .58) {
    const edge = all.filter(([x,y]) =>
      !cells.has(`${x-1},${y}`) ||
      !cells.has(`${x+1},${y}`) ||
      !cells.has(`${x},${y-1}`) ||
      !cells.has(`${x},${y+1}`)
    );
    const candidate = edge[int(0,edge.length-1)];
    if (candidate) {
      const [x,y] = candidate;
      const neighbors = [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]
        .filter(([nx,ny])=>cells.has(`${nx},${ny}`)).length;
      if (neighbors <= 2) cells.delete(`${x},${y}`);
    }
  }

  const result = [...cells.values()];
  if (result.length < 45) return randomIsland();

  return result;
}

/* КОНТУР */

/* Едва заметное несовмещение печатных слоёв — только на линии контура. */
function makeOutline(cells) {

  const set = new Set(
    cells.map(c => `${c[0]},${c[1]}`)
  );

  const has = (x,y) => set.has(`${x},${y}`);

  const lines = [];

  for (const [x,y] of cells) {

    const x1 = x*CELL;
    const y1 = y*CELL;
    const x2 = x1+CELL;
    const y2 = y1+CELL;

    if (!has(x,y-1)) lines.push(`M${x1} ${y1}H${x2}`);
    if (!has(x+1,y)) lines.push(`M${x2} ${y1}V${y2}`);
    if (!has(x,y+1)) lines.push(`M${x2} ${y2}H${x1}`);
    if (!has(x-1,y)) lines.push(`M${x1} ${y2}V${y1}`);
  }

  return lines.join("");
}


/* СОХРАНЕНИЕ */

function save() {

  try {
    localStorage.setItem(KEY,JSON.stringify(state));
  } catch(e) {
    console.log("Ошибка сохранения",e);
  }
}


/* ПРОГРЕСС */

function getProgress(exercise) {

  const cells = exercise.maps.flatMap(m=>m.cells);

  if (!cells.length) return 0;

  const filled = cells.filter(c=>c[2]).length;

  return Math.floor(filled/cells.length*100);
}


/* ГЛАВНАЯ */

function renderHome() {

  list.replaceChildren();
  const atlas = document.getElementById("trainingAtlas");
  atlas.replaceChildren();

  document.getElementById("exerciseCount").textContent =
    String(state.exercises.length).padStart(2,"0");

  state.exercises.forEach(exercise=>{

    const openOrDelete = ()=>{
      if (deleteMode) {
        if (!confirm("Удалить упражнение?")) return;
        state.exercises = state.exercises.filter(e=>e.id!==exercise.id);
        save();
        renderHome();
        return;
      }
      openExercise(exercise.id);
    };

    // Compact list at the top.
    const row = document.createElement("div");
    row.className = "exercise";

    const name = document.createElement("button");
    name.className = "exercise-name";
    name.type = "button";
    name.textContent = starText(exercise.name);
    name.onclick = openOrDelete;

    const percent = document.createElement("span");
    percent.className = "exercise-percent";
    percent.textContent = String((exercise.maps || []).reduce(
      (total,map)=>total+map.cells.filter(cell=>cell[2]).length,0
    ));
    row.append(name,percent);
    row.classList.toggle("is-delete-mode",deleteMode);
    list.appendChild(row);

    // Vertical island sheet below the list: one column per training.
    const column = document.createElement("div");
    column.className = "atlas-column";

    const title = document.createElement("button");
    title.className = "atlas-title";
    title.type = "button";
    title.textContent = starText(exercise.name);
    title.onclick = openOrDelete;

    const islands = document.createElement("div");
    islands.className = "atlas-islands";

    (exercise.maps || []).forEach(map=>{
      const preview = document.createElementNS("http://www.w3.org/2000/svg","svg");
      const xs = map.cells.map(cell=>cell[0]);
      const ys = map.cells.map(cell=>cell[1]);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const cropPad = 1.25;
      const cropX = Math.max(0,minX-cropPad);
      const cropY = Math.max(0,minY-cropPad);
      const cropRight = Math.min(COLS,maxX+1+cropPad);
      const cropBottom = Math.min(ROWS,maxY+1+cropPad);
      preview.setAttribute(
        "viewBox",
        `${cropX*CELL} ${cropY*CELL} ${(cropRight-cropX)*CELL} ${(cropBottom-cropY)*CELL}`
      );
      preview.setAttribute("class","atlas-island");
      preview.setAttribute("role","button");
      preview.setAttribute("aria-label",starText(exercise.name));
      preview.addEventListener("click",openOrDelete);

      map.cells.forEach(cell=>{
        const rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
        rect.setAttribute("x",cell[0]*CELL-.25);
        rect.setAttribute("y",cell[1]*CELL-.25);
        rect.setAttribute("width",CELL+.5);
        rect.setAttribute("height",CELL+.5);
        rect.setAttribute("rx","1.15");
        rect.setAttribute("ry","1.15");
        rect.setAttribute("class",cell[2]?"cell filled":"cell");
        preview.appendChild(rect);
      });

      const outline = document.createElementNS("http://www.w3.org/2000/svg","path");
      outline.setAttribute("d",makeOutline(map.cells));
      outline.setAttribute("class","outline");
      preview.appendChild(outline);
      islands.appendChild(preview);
    });

    column.append(title,islands);
    atlas.appendChild(column);
  });
}
/* РЕЖИМ УДАЛЕНИЯ */

document.getElementById("deleteMode").onclick = ()=>{
  deleteMode = !deleteMode;
  const button = document.getElementById("deleteMode");
  button.classList.toggle("is-active",deleteMode);
  button.setAttribute("aria-pressed",String(deleteMode));
  renderHome();
};


/* ДОБАВЛЕНИЕ УПРАЖНЕНИЯ */

document.getElementById("addExercise").onclick = ()=>{

  const name = prompt("Название упражнения:");

  if (!name || !name.trim()) return;

  state.exercises.push({

    id: Date.now().toString()+
      Math.random().toString(36).slice(2),

    name: name.trim(),

    reps: 0,

    maps: [
      {cells:randomIsland()}
    ]

  });

  save();
  renderHome();
};


/* ТЕКУЩЕЕ УПРАЖНЕНИЕ */

function getCurrent() {

  return state.exercises.find(
    e=>e.id===currentId
  );
}


/* ОТКРЫТИЕ КАРТЫ */

function openExercise(id) {

  currentId = id;

  const exercise = getCurrent();

  if (!exercise) return;

  home.classList.add("hidden");
  workout.classList.remove("hidden");

  app.classList.add("view-map");

  document.getElementById("mapTitle").textContent =
    starText(exercise.name);

  renderWorkout();

  window.scrollTo(0,0);
}


/* РЕДАКТИРОВАНИЕ НАЗВАНИЯ В ЗАГОЛОВКЕ */

document.getElementById("editTitle").onclick = ()=>{
  const exercise = getCurrent();
  if (!exercise) return;

  const nextName = prompt("Новое название упражнения:",exercise.name);
  if (!nextName || !nextName.trim()) return;

  exercise.name = nextName.trim();
  document.getElementById("mapTitle").textContent = starText(exercise.name);
  save();
};


/* НАЗАД */

document.getElementById("back").onclick = ()=>{

  currentId = null;

  workout.classList.add("hidden");
  home.classList.remove("hidden");

  app.classList.remove("view-map");

  renderHome();

  window.scrollTo(0,0);
};


/* ОТРИСОВКА КАРТ */

function createMapSection(map,mapIndex) {
  const section = document.createElement("div");
  section.className = "map";

  const svg = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "svg"
  );

  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

  map.cells.forEach((cell,i)=>{
    const rect = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

    // Едва смягчаем внешний силуэт острова, сохраняя плотную сетку без щелей.
    rect.setAttribute("x",cell[0]*CELL - 0.25);
    rect.setAttribute("y",cell[1]*CELL - 0.25);
    rect.setAttribute("width",CELL + 0.5);
    rect.setAttribute("height",CELL + 0.5);
    rect.setAttribute("rx","1.15");
    rect.setAttribute("ry","1.15");
    rect.setAttribute("class",cell[2]?"cell filled":"cell");
    rect.dataset.cell = i;
    svg.appendChild(rect);
  });

  const outline = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "path"
  );

  outline.setAttribute("d",makeOutline(map.cells));
  outline.setAttribute("class","outline");
  svg.appendChild(outline);


  // Определяем ячейку по координатам касания, а не по event.target.
  svg.addEventListener("pointerdown",event=>{
    const box = svg.getBoundingClientRect();
    if (!box.width || !box.height) return;

    const x = Math.floor((event.clientX - box.left) / box.width * COLS);
    const y = Math.floor((event.clientY - box.top) / box.height * ROWS);
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

    const cellIndex = map.cells.findIndex(
      cell => cell[0] === x && cell[1] === y
    );

    if (cellIndex < 0) return;
    event.preventDefault();

    const rect = svg.querySelector(`[data-cell="${cellIndex}"]`);
    if (rect) {
      window.clearTimeout(rect._pressTimer);
      rect.classList.add("is-pressing");
      rect._pressTimer = window.setTimeout(()=>{
        rect.classList.remove("is-pressing");
        rect._pressTimer = null;
      },105);
    }

    addRep(mapIndex,cellIndex);
  });

  section.appendChild(svg);
  return section;
}

function renderWorkout() {
  const exercise = getCurrent();
  if (!exercise) return;

  mapsEl.replaceChildren();
  exercise.maps.forEach((map,mapIndex)=>{
    mapsEl.appendChild(createMapSection(map,mapIndex));
  });

  updateInfo();
}

/* СЛУЧАЙНЫЙ НОВЫЙ КОНТУР С СОХРАНЕНИЕМ ОТМЕТОК */

function rerollLargestMap() {

  const exercise = getCurrent();
  if (!exercise) return;

  if (!exercise.maps.length) {
    exercise.maps.push({cells:randomIsland()});
    save();
    renderWorkout();
    return;
  }

  // Меняем только самый крупный контур по количеству ячеек.
  let mapIndex = 0;
  for (let i=1;i<exercise.maps.length;i++) {
    if (exercise.maps[i].cells.length > exercise.maps[mapIndex].cells.length) {
      mapIndex = i;
    }
  }

  const oldMap = exercise.maps[mapIndex];
  if (!oldMap) return;

  const filledCount = oldMap.cells.filter(cell=>cell[2]).length;

  // Создаём новый остров и переносим на него все отметки.
  const replacement = {cells:randomIsland()};
  const firstBatch = Math.min(filledCount,replacement.cells.length);

  for (let i=0;i<firstBatch;i++) {
    replacement.cells[i][2] = true;
  }

  let remaining = filledCount-firstBatch;
  const overflowMaps = [];

  // Если новый остров меньше числа уже отмеченных ячеек,
  // остаток переносится на дополнительные полностью/частично заполненные карты.
  while (remaining > 0) {
    const nextMap = {cells:randomIsland()};
    const batch = Math.min(remaining,nextMap.cells.length);

    for (let i=0;i<batch;i++) {
      nextMap.cells[i][2] = true;
    }

    remaining -= batch;
    overflowMaps.push(nextMap);
  }

  exercise.maps.splice(mapIndex,1,replacement,...overflowMaps);

  save();
  renderWorkout();
}

document.getElementById("rerollLargest").onclick = rerollLargestMap;



/* ПОВТОРЕНИЯ */

function addRep(mapIndex,cellIndex) {

  const exercise = getCurrent();

  if (!exercise) return;

  const map = exercise.maps[mapIndex];
  const cell = map?.cells[cellIndex];

  if (!cell) return;

  if (cell[2]) {

    cell[2] = false;

    exercise.reps = Math.max(
      0,
      exercise.reps-1
    );

  } else {

    cell[2] = true;
    exercise.reps++;
  }

  // Если контур полностью опустел, убираем его из карты.
  if (!cell[2] && map.cells.every(c=>!c[2])) {
    exercise.maps.splice(mapIndex,1);
    renderWorkout();
    updateInfo();
    save();
    return;
  }

  const svg = mapsEl.children[mapIndex]?.querySelector("svg");

  const rect = svg?.querySelector(
    `[data-cell="${cellIndex}"]`
  );

  if (rect) {
    // Меняется только плотность самой клетки — без дополнительных эффектов.
    rect.classList.toggle("filled",cell[2]);
  }

  if (cell[2]) playTone(520, .045, .016);

  const lastMap = exercise.maps[exercise.maps.length-1];

  if (
    lastMap.cells.every(c=>c[2]) &&
    mapIndex===exercise.maps.length-1
  ) {

    const completedSection = mapsEl.children[mapIndex];
    if (completedSection) {
      completedSection.classList.add("just-claimed");
      window.setTimeout(
        ()=>completedSection.classList.remove("just-claimed"),
        700
      );
    }

    const nextMap = {cells:randomIsland()};
    exercise.maps.push(nextMap);

    const nextSection = createMapSection(nextMap,exercise.maps.length-1);
    nextSection.classList.add("is-entering");
    mapsEl.appendChild(nextSection);
    window.setTimeout(()=>nextSection.classList.remove("is-entering"),900);

    // Камера спокойно переходит к новой территории; предыдущая остаётся выше.
    requestAnimationFrame(()=>scrollToNewMap(nextSection));
  }

  updateInfo();
  save();
}


/* ИНФОРМАЦИЯ */

function updateAnimatedValue(element, value) {
  const next = String(value);
  if (element.textContent === next) return;

  element.textContent = next;
  element.classList.remove("count-change");
  // Перезапускаем короткую анимацию только у изменившейся цифры.
  void element.offsetWidth;
  element.classList.add("count-change");
}

function updateInfo() {

  const exercise = getCurrent();

  if (!exercise) return;

  updateAnimatedValue(
    document.getElementById("mapPercent"),
    getProgress(exercise)+"%"
  );

  updateAnimatedValue(
    document.getElementById("totalReps"),
    String(exercise.reps).padStart(3,"0")
  );

  save();
}


/* ЗАГРУЗКА */

try {

  const saved = JSON.parse(
    localStorage.getItem(KEY)
  );

  if (saved && Array.isArray(saved.exercises)) {
    state = saved;
  }

} catch(e) {}


/* МИГРАЦИЯ СТАРОЙ ВЕРСИИ */

if (!state.exercises.length) {

  try {

    const old = JSON.parse(
      localStorage.getItem("workout-map-v1")
    );

    if (old && Array.isArray(old.maps)) {

      state.exercises.push({

        id:"old-workout",
        name:"Тренировка",
        reps:old.total||0,
        maps:old.maps

      });
    }

  } catch(e) {}
}


/* ЗАПУСК */

renderHome();
save();

})();
</script>

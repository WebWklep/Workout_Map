<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eeede8">
<title>UNFOG</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --paper: #eeede8;
  --ink: #353430;
  --soft: #85847e;
  --line: #aaa9a2;
  --cell: #33322f;
}

html {
  background: var(--paper);
  overflow-x: hidden;
}

body {
  overflow-x: hidden;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  background: #eeede8;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* Без зерна и дымки — чистая резкая поверхность */



body::after {
  content: "";
  position: fixed;
  inset: -10px;
  z-index: 29;
  pointer-events: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  background: transparent;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#app {
  min-height: 100vh;
  padding: 25px 20px;
  position: relative;
  z-index: 1;
}

.hidden {
  display: none !important;
}

/* ТИПОГРАФИКА */

.topline,
.map-title,
.map-info,
.footer,
.exercise {
  font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  font-stretch: condensed;
  letter-spacing: -.65px;
}

.topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 38px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -.8px;
  color: #4b4a45;
  text-shadow: none;
}

#exerciseList {
  display: flex;
  flex-direction: column;
}

.exercise {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto 38px 38px;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(90,89,82,.28);
}

.exercise-name {
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -.8px;
  text-align: left;
  overflow-wrap: anywhere;
  padding: 10px 0;
  color: #383732;
  text-shadow: none;
}

.exercise-percent {
  font-size: 13px;
  color: #85847e;
}

.row-action {
  display: grid;
  place-items: center;
  width: 38px;
  height: 40px;
  font-size: 20px;
  color: #85847e;
}

.edit-name {
  font-size: 17px;
}

.delete {
  font-size: 21px;
  color: #999890;
}

.map-toolbar {
  display: flex;
  justify-content: flex-end;
  margin: 0 5px 5px;
}

.reroll-map {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #353430;
  color: #fff;
  font-size: 22px;
  line-height: 1;
}

.add {
  display: block;
  width: 48px;
  height: 48px;
  margin-top: 20px;
  padding: 0;
  font-size: 27px;
  color: #65645e;
  text-align: left;
  position: relative;
  z-index: 5;
}

/* КАРТА */

#app.view-map {
  padding-left: 4px;
  padding-right: 4px;
}

.map-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 0 13px 28px;
}

.back {
  font-size: 23px;
  width: 44px;
  height: 44px;
  text-align: left;
  color: #55544e;
}

.map-title {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -.8px;
  overflow-wrap: anywhere;
  text-shadow: none;
}

.map-info {
  display: flex;
  justify-content: space-between;
  margin: 0 13px 20px;
  font-size: 13px;
  font-weight: 500;
  color: #85847c;
  letter-spacing: -.4px;
}

#maps {
  display: flex;
  flex-direction: column;
  gap: 30px;
  width: 104%;
  margin-left: -2%;
}

.map {
  width: 100%;
  position: relative;
}

.map svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  touch-action: manipulation;
  filter: none;
}

/* КЛЕТКИ */

.cell {
  fill: transparent;
}

.cell.filled {
  fill: var(--cell);
}

/* КОНТУР */

.outline {
  pointer-events: none;
  fill: none;
  stroke: #55544e;
  stroke-width: 1.1;
  stroke-linejoin: miter;
  vector-effect: non-scaling-stroke;
  filter: none;
}

.footer {
  margin: 35px 13px 0;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  font-size: 13px;
  color: #77766f;
  letter-spacing: -.3px;
}

#totalReps {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .2px;
  font-variant-numeric: tabular-nums;
}

button:active {
  opacity: .65;
}
</style>
</head>

<body>

<div id="app">

<section id="home">

  <div class="topline">
    <span>UNFOG</span>
    <span id="exerciseCount">00</span>
  </div>

  <div id="exerciseList"></div>

  <button class="add" id="addExercise" type="button">+</button>

</section>

<section id="workout" class="hidden">

  <div class="map-header">
    <button class="back" id="back" type="button">←</button>
    <span class="map-title" id="mapTitle"></span>
  </div>

  <div class="map-info">
    <span>MAP✶PROGRESS</span>
    <span id="mapPercent">0%</span>
  </div>

  <div id="maps"></div>

  <div class="footer">
    <span>TOTAL✶REPS</span>
    <span id="totalReps">000</span>
  </div>

</section>

</div>

<script>
(() => {

const COLS = 22;
const ROWS = 28;
const CELL = 18;

const W = COLS * CELL;
const H = ROWS * CELL;

const KEY = "workout-map-v2";

const app = document.getElementById("app");
const home = document.getElementById("home");
const workout = document.getElementById("workout");
const list = document.getElementById("exerciseList");
const mapsEl = document.getElementById("maps");

let currentId = null;

let state = {
  exercises: []
};


/* СИМВОЛ ВМЕСТО ПРОБЕЛОВ */

function starText(text) {
  return String(text).trim().replace(/\s+/g, "✶");
}


/* СЛУЧАЙНЫЙ ОСТРОВ */

function randomIsland() {

  const cells = [];

  const seed = Math.random() * 10000;

  const mode = Math.floor(Math.random() * 7);

  const blobs = [];

  const rand = (a,b) => a + Math.random() * (b-a);

  // Разные композиции

  let count = 1;

  if (mode === 1) count = 2;
  if (mode === 2) count = 3;
  if (mode === 3) count = 4;
  if (mode === 4) count = 2;
  if (mode === 5) count = 5;
  if (mode === 6) count = 3;

  // Основное направление территории

  let angle = rand(0,Math.PI*2);

  if (mode === 1) angle = 0;
  if (mode === 2) angle = Math.PI/2;
  if (mode === 3) angle = rand(0,Math.PI);
  if (mode === 4) angle = rand(0,Math.PI*2);

  const horizontal = Math.cos(angle);
  const vertical = Math.sin(angle);

  const centerX = 10.5;
  const centerY = 13.5;

  // Создание отдельных массивов

  for (let i=0;i<count;i++) {

    let t = count === 1 ? 0 : (i/(count-1)-.5);

    let x = centerX + horizontal*t*11;
    let y = centerY + vertical*t*15;

    if (mode === 5) {
      x += rand(-5,5);
      y += rand(-5,5);
    }

    if (mode === 6) {
      x += rand(-3,3);
      y += rand(-7,7);
    }

    const rx = rand(3.5,7.5);
    const ry = rand(3.5,8.5);

    blobs.push({
      x,
      y,
      rx,
      ry,
      rotation: rand(0,Math.PI*2),
      phase: rand(0,Math.PI*2),
      waves: rand(.08,.24),
      lobes: 2+Math.floor(Math.random()*5)
    });
  }

  // Иногда создаём длинную перемычку

  const bridge = mode === 1 || mode === 3 || mode === 6;

  function insideBlob(x,y,b) {

    const dx = x-b.x;
    const dy = y-b.y;

    const cos = Math.cos(b.rotation);
    const sin = Math.sin(b.rotation);

    const rx = dx*cos + dy*sin;
    const ry = -dx*sin + dy*cos;

    const nx = rx/b.rx;
    const ny = ry/b.ry;

    const angle = Math.atan2(ny,nx);

    const radius = Math.sqrt(nx*nx+ny*ny);

    const wave =
      b.waves*Math.sin(angle*b.lobes+b.phase) +
      b.waves*.45*Math.cos(angle*7-b.phase);

    return radius < .86 + wave;
  }

  function inside(x,y) {

    let result = false;

    for (const b of blobs) {
      if (insideBlob(x,y,b)) {
        result = true;
        break;
      }
    }

    if (!result && bridge && count > 1) {

      const dx = x-centerX;
      const dy = y-centerY;

      const along = dx*horizontal + dy*vertical;
      const across = -dx*vertical + dy*horizontal;

      if (
        Math.abs(along)<10 &&
        Math.abs(across)<1.25
      ) {
        result = true;
      }
    }

    // Неровность края

    if (result) {

      const noise =
        Math.sin(x*.9+seed)*.045 +
        Math.cos(y*.8-seed)*.045 +
        Math.sin((x+y)*.5+seed)*.035;

      if (Math.random() < .025) result=false;
      else if (noise < -.07 && Math.random()<.15) result=false;
    }

    return result;
  }

  for (let y=0;y<ROWS;y++) {
    for (let x=0;x<COLS;x++) {

      if (inside(x,y)) {
        cells.push([x,y,false]);
      }

    }
  }

  // Защита от слишком маленькой карты

  if (cells.length < 45) {
    return randomIsland();
  }

  return cells;
}


/* КОНТУР */

function makeOutline(cells) {

  const set = new Set(
    cells.map(c => `${c[0]},${c[1]}`)
  );

  const has = (x,y) => set.has(`${x},${y}`);

  const lines = [];

  for (const [x,y] of cells) {

    const x1 = x*CELL;
    const y1 = y*CELL;
    const x2 = x1+CELL;
    const y2 = y1+CELL;

    if (!has(x,y-1)) lines.push(`M${x1} ${y1}H${x2}`);
    if (!has(x+1,y)) lines.push(`M${x2} ${y1}V${y2}`);
    if (!has(x,y+1)) lines.push(`M${x2} ${y2}H${x1}`);
    if (!has(x-1,y)) lines.push(`M${x1} ${y2}V${y1}`);
  }

  return lines.join("");
}


/* СОХРАНЕНИЕ */

function save() {

  try {
    localStorage.setItem(KEY,JSON.stringify(state));
  } catch(e) {
    console.log("Ошибка сохранения",e);
  }
}


/* ПРОГРЕСС */

function getProgress(exercise) {

  const cells = exercise.maps.flatMap(m=>m.cells);

  if (!cells.length) return 0;

  const filled = cells.filter(c=>c[2]).length;

  return Math.floor(filled/cells.length*100);
}


/* ГЛАВНАЯ */

function renderHome() {

  list.replaceChildren();

  document.getElementById("exerciseCount").textContent =
    String(state.exercises.length).padStart(2,"0");

  state.exercises.forEach(exercise=>{

    const row = document.createElement("div");
    row.className = "exercise";

    const name = document.createElement("button");
    name.className = "exercise-name";
    name.type = "button";

    name.textContent = starText(exercise.name);

    name.onclick = ()=>openExercise(exercise.id);

    const percent = document.createElement("span");
    percent.className = "exercise-percent";
    percent.textContent = getProgress(exercise)+"%";

    const edit = document.createElement("button");
    edit.className = "row-action edit-name";
    edit.type = "button";
    edit.textContent = "✎";
    edit.setAttribute("aria-label","Изменить название");

    edit.onclick = ()=>{
      const nextName = prompt("Новое название упражнения:",exercise.name);
      if (!nextName || !nextName.trim()) return;

      exercise.name = nextName.trim();
      save();
      renderHome();

      if (currentId === exercise.id) {
        document.getElementById("mapTitle").textContent = starText(exercise.name);
      }
    };

    const del = document.createElement("button");
    del.className = "row-action delete";
    del.type = "button";
    del.textContent = "×";

    del.onclick = ()=>{

      if (!confirm("Удалить упражнение?")) return;

      state.exercises = state.exercises.filter(
        e=>e.id!==exercise.id
      );

      save();
      renderHome();
    };

    row.append(name,percent,edit,del);
    list.appendChild(row);
  });
}


/* ДОБАВЛЕНИЕ УПРАЖНЕНИЯ */

document.getElementById("addExercise").onclick = ()=>{

  const name = prompt("Название упражнения:");

  if (!name || !name.trim()) return;

  state.exercises.push({

    id: Date.now().toString()+
      Math.random().toString(36).slice(2),

    name: name.trim(),

    reps: 0,

    maps: [
      {cells:randomIsland()}
    ]

  });

  save();
  renderHome();
};


/* ТЕКУЩЕЕ УПРАЖНЕНИЕ */

function getCurrent() {

  return state.exercises.find(
    e=>e.id===currentId
  );
}


/* ОТКРЫТИЕ КАРТЫ */

function openExercise(id) {

  currentId = id;

  const exercise = getCurrent();

  if (!exercise) return;

  home.classList.add("hidden");
  workout.classList.remove("hidden");

  app.classList.add("view-map");

  document.getElementById("mapTitle").textContent =
    starText(exercise.name);

  renderWorkout();

  window.scrollTo(0,0);
}


/* НАЗАД */

document.getElementById("back").onclick = ()=>{

  currentId = null;

  workout.classList.add("hidden");
  home.classList.remove("hidden");

  app.classList.remove("view-map");

  renderHome();

  window.scrollTo(0,0);
};


/* ОТРИСОВКА КАРТ */

function renderWorkout() {

  const exercise = getCurrent();

  if (!exercise) return;

  mapsEl.replaceChildren();

  exercise.maps.forEach((map,mapIndex)=>{

    const section = document.createElement("div");
    section.className = "map";

    const toolbar = document.createElement("div");
    toolbar.className = "map-toolbar";

    const reroll = document.createElement("button");
    reroll.className = "reroll-map";
    reroll.type = "button";
    reroll.textContent = "⚄";
    reroll.setAttribute("aria-label","Сменить контур карты");
    reroll.title = "Сменить контур";

    reroll.onclick = ()=>rerollMap(mapIndex);
    toolbar.appendChild(reroll);
    section.appendChild(toolbar);

    const svg = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );

    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

    map.cells.forEach((cell,i)=>{

      const rect = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "rect"
      );

      rect.setAttribute("x",cell[0]*CELL);
      rect.setAttribute("y",cell[1]*CELL);
      rect.setAttribute("width",CELL);
      rect.setAttribute("height",CELL);

      rect.setAttribute(
        "class",
        cell[2]?"cell filled":"cell"
      );

      rect.dataset.cell = i;

      svg.appendChild(rect);
    });

    const outline = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    outline.setAttribute("d",makeOutline(map.cells));
    outline.setAttribute("class","outline");

    svg.appendChild(outline);

    // Определяем ячейку по координатам касания, а не по event.target.
    // Это исключает промахи из-за SVG-контура и особенностей мобильного браузера.
    svg.addEventListener("pointerdown",event=>{

      const box = svg.getBoundingClientRect();

      if (!box.width || !box.height) return;

      const x = Math.floor((event.clientX - box.left) / box.width * COLS);
      const y = Math.floor((event.clientY - box.top) / box.height * ROWS);

      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

      const cellIndex = map.cells.findIndex(
        cell => cell[0] === x && cell[1] === y
      );

      if (cellIndex < 0) return;

      event.preventDefault();
      addRep(mapIndex,cellIndex);
    });

    section.appendChild(svg);
    mapsEl.appendChild(section);
  });

  updateInfo();
}


/* СЛУЧАЙНЫЙ НОВЫЙ КОНТУР С СОХРАНЕНИЕМ ОТМЕТОК */

function rerollMap(mapIndex) {

  const exercise = getCurrent();
  if (!exercise) return;

  const oldMap = exercise.maps[mapIndex];
  if (!oldMap) return;

  const filledCount = oldMap.cells.filter(cell=>cell[2]).length;

  // Создаём новый остров и переносим на него все отметки.
  const replacement = {cells:randomIsland()};
  const firstBatch = Math.min(filledCount,replacement.cells.length);

  for (let i=0;i<firstBatch;i++) {
    replacement.cells[i][2] = true;
  }

  let remaining = filledCount-firstBatch;
  const overflowMaps = [];

  // Если новый остров меньше числа уже отмеченных ячеек,
  // остаток переносится на дополнительные полностью/частично заполненные карты.
  while (remaining > 0) {
    const nextMap = {cells:randomIsland()};
    const batch = Math.min(remaining,nextMap.cells.length);

    for (let i=0;i<batch;i++) {
      nextMap.cells[i][2] = true;
    }

    remaining -= batch;
    overflowMaps.push(nextMap);
  }

  exercise.maps.splice(mapIndex,1,replacement,...overflowMaps);

  save();
  renderWorkout();
}


/* ПОВТОРЕНИЯ */

function addRep(mapIndex,cellIndex) {

  const exercise = getCurrent();

  if (!exercise) return;

  const map = exercise.maps[mapIndex];
  const cell = map?.cells[cellIndex];

  if (!cell) return;

  if (cell[2]) {

    cell[2] = false;

    exercise.reps = Math.max(
      0,
      exercise.reps-1
    );

  } else {

    cell[2] = true;
    exercise.reps++;
  }

  const svg = mapsEl.children[mapIndex]?.querySelector("svg");

  const rect = svg?.querySelector(
    `[data-cell="${cellIndex}"]`
  );

  if (rect) {
    rect.setAttribute(
      "class",
      cell[2]?"cell filled":"cell"
    );
  }

  const lastMap = exercise.maps[exercise.maps.length-1];

  if (
    lastMap.cells.every(c=>c[2]) &&
    mapIndex===exercise.maps.length-1
  ) {

    exercise.maps.push({
      cells:randomIsland()
    });

    renderWorkout();
  }

  updateInfo();
  save();
}


/* ИНФОРМАЦИЯ */

function updateInfo() {

  const exercise = getCurrent();

  if (!exercise) return;

  document.getElementById("mapPercent").textContent =
    getProgress(exercise)+"%";

  document.getElementById("totalReps").textContent =
    String(exercise.reps).padStart(3,"0");

  save();
}


/* ЗАГРУЗКА */

try {

  const saved = JSON.parse(
    localStorage.getItem(KEY)
  );

  if (saved && Array.isArray(saved.exercises)) {
    state = saved;
  }

} catch(e) {}


/* МИГРАЦИЯ СТАРОЙ ВЕРСИИ */

if (!state.exercises.length) {

  try {

    const old = JSON.parse(
      localStorage.getItem("workout-map-v1")
    );

    if (old && Array.isArray(old.maps)) {

      state.exercises.push({

        id:"old-workout",
        name:"Тренировка",
        reps:old.total||0,
        maps:old.maps

      });
    }

  } catch(e) {}
}


/* ЗАПУСК */

renderHome();
save();

})();
</script>

</body>
</html>

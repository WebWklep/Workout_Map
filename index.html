<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>CLAIM BY POWER</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --paper: #ffffff;
  --ink: #353430;
  --soft: #85847e;
  --line: #aaa9a2;
  --cell: #55534f;
}

html {
  background: var(--paper);
  overflow-x: hidden;
}

body {
  overflow-x: hidden;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #ffffff;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
}

/* Чистая бумажная основа с очень деликатным печатным зерном */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  opacity: .105;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)' opacity='.34'/%3E%3C/svg%3E");
  background-size: 180px 180px;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#app {
  min-height: 100vh;
  padding: 25px 20px;
  position: relative;
  z-index: 1;
}

.hidden {
  display: none !important;
}

/* ТИПОГРАФИКА */

.topline,
.map-title,
.map-info,
.footer,
.exercise {
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-stretch: normal;
  letter-spacing: -.2px;
}

.topline {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 46px;
  color: #4b4a45;
  text-shadow: none;
}

.brand-lockup {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  line-height: 1;
}

.brand-main {
  font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  font-size: 28px;
  line-height: .88;
  font-weight: 750;
  letter-spacing: -.075em;
}

.brand-sub {
  margin-top: 4px;
  font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  font-size: 8px;
  line-height: 1;
  font-weight: 600;
  letter-spacing: .34em;
  color: #85817a;
}

#exerciseCount {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  padding-top: 1px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 19px;
  line-height: .9;
  font-weight: 400;
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
  color: #4b4a45;
}

#exerciseCount::after {
  content: "EXERCISES";
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 7px;
  line-height: 1;
  font-weight: 500;
  letter-spacing: .14em;
  color: #96938c;
}

#exerciseList {
  display: flex;
  flex-direction: column;
}

#exerciseList::before {
  content: "TRAINING INDEX";
  display: block;
  margin-bottom: 17px;
  color: #96938c;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .16em;
}

.exercise {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto 38px;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
  border-bottom: 0;
}

.exercise-name {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 19px;
  line-height: 1.12;
  font-weight: 400;
  letter-spacing: -.4px;
  text-align: left;
  overflow-wrap: anywhere;
  padding: 7px 0;
  color: #383732;
  text-shadow: none;
}

.exercise-percent {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  letter-spacing: .015em;
  color: #96938c;
}

.row-action {
  display: grid;
  place-items: center;
  width: 38px;
  height: 40px;
  font-size: 20px;
  color: #85847e;
}

.delete {
  font-size: 21px;
  color: #999890;
}

.edit-title {
  display: grid;
  place-items: center;
  width: 36px;
  height: 40px;
  margin-left: auto;
  flex: 0 0 36px;
  color: #77766f;
  font-size: 18px;
}

.reroll-map {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #222;
  font-size: 23px;
  line-height: 1;
  box-shadow: none;
  -webkit-appearance: none;
  appearance: none;
}

.map-progress-value {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 0 auto;
}

.add {
  display: block;
  width: 48px;
  height: 48px;
  margin-top: 20px;
  padding: 0;
  font-size: 27px;
  color: #65645e;
  text-align: left;
  position: relative;
  z-index: 5;
}

/* КАРТА */

#app.view-map {
  padding-left: 4px;
  padding-right: 4px;
}

.map-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 13px 28px;
}

.back {
  font-size: 23px;
  width: 44px;
  height: 44px;
  text-align: left;
  color: #55544e;
}

.map-title {
  font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  font-size: 18px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -.045em;
  color: #5b5953;
  overflow-wrap: anywhere;
  text-shadow: none;
  min-width: 0;
  flex: 1;
}

.map-info {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 13px 20px;
  font-family: ui-rounded, "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  font-weight: 750;
  text-transform: uppercase;
  color: #929088;
  letter-spacing: -.045em;
}

.map-progress-value {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: -2px;
}

.reroll-map {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #222;
  font-size: 22px;
  line-height: 1;
  box-shadow: none;
  -webkit-appearance: none;
  appearance: none;
}

.reroll-map:focus,
.reroll-map:active {
  outline: none;
  background: transparent;
}

#maps {
  display: flex;
  flex-direction: column;
  gap: 30px;
  width: 104%;
  margin-left: -2%;
}

.map {
  width: 100%;
  position: relative;
}

.map svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  touch-action: manipulation;
  filter: none;
}

/* КЛЕТКИ */

.cell {
  fill: transparent;
  transition: fill .22s cubic-bezier(.2,.65,.3,1);
}

.cell.filled {
  fill: var(--cell);
}


/* Тихая смена цифр без скачка интерфейса */
.count-change {
  display: inline-block;
  animation: countChange .18s ease-out both;
}

@keyframes countChange {
  0% { opacity: .45; transform: translateY(3px); }
  100% { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .cell,
  .count-change {
    animation: none !important;
    transition: none !important;
  }
}

/* Короткий визуальный отклик завершённой территории */
.map.just-claimed svg {
  animation: claimSettle .65s ease-out both;
}

@keyframes claimSettle {
  0% { filter: contrast(1); }
  45% { filter: contrast(1.07); }
  100% { filter: contrast(1); }
}

/* КОНТУР */

.outline {
  pointer-events: none;
  fill: none;
  stroke: #77746e;
  stroke-width: 1;
  stroke-linejoin: miter;
  vector-effect: non-scaling-stroke;
  filter: none;
}

.footer {
  position: fixed;
  left: 13px;
  bottom: max(12px, env(safe-area-inset-bottom));
  margin: 0;
  display: flex;
  justify-content: flex-start;
  gap: 9px;
  font-size: 13px;
  color: #77766f;
  letter-spacing: -.3px;
  z-index: 20;
}

#totalReps {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .2px;
  font-variant-numeric: tabular-nums;
}

button:active {
  opacity: .65;
}
</style>
</head>

<body>

<div id="app">

<section id="home">

  <div class="topline">
    <div class="brand-lockup" aria-label="Claim by Power">
      <span class="brand-main">CLAIM</span>
      <span class="brand-sub">BY POWER</span>
    </div>
    <span id="exerciseCount">00</span>
  </div>

  <div id="exerciseList"></div>

  <button class="add" id="addExercise" type="button">+</button>

</section>

<section id="workout" class="hidden">

  <div class="map-header">
    <button class="back" id="back" type="button">←</button>
    <span class="map-title" id="mapTitle"></span>
    <button class="edit-title" id="editTitle" type="button" aria-label="Изменить название">✎</button>
  </div>

  <div class="map-info">
    <span>MAP✶PROGRESS <span id="mapPercent">0%</span></span>
    <button class="reroll-map" id="rerollLargest" type="button" aria-label="Сменить самый большой контур" title="Сменить самый большой контур">⚄</button>
  </div>

  <div id="maps"></div>

  <div class="footer">
    <span>TOTAL✶REPS</span>
    <span id="totalReps">000</span>
  </div>

</section>

</div>

<script>
(() => {

const COLS = 22;
const ROWS = 28;
const CELL = 18;

const W = COLS * CELL;
const H = ROWS * CELL;

const KEY = "workout-map-v2";

const app = document.getElementById("app");
const home = document.getElementById("home");
const workout = document.getElementById("workout");
const list = document.getElementById("exerciseList");
const mapsEl = document.getElementById("maps");

let currentId = null;
let audioContext = null;

function playTone(frequency = 520, duration = 0.045, volume = 0.018) {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    audioContext ||= new AudioContextClass();
    if (audioContext.state === "suspended") audioContext.resume();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
    gain.gain.setValueAtTime(volume, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  } catch (e) {}
}

function scrollToNewMap(section) {
  if (!section) return;

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const startY = window.scrollY;
  const targetY = section.getBoundingClientRect().top + startY - 118;
  const distance = targetY - startY;

  if (reducedMotion || Math.abs(distance) < 2) {
    window.scrollTo(0,targetY);
    return;
  }

  const duration = 760;
  const startTime = performance.now();

  function step(now) {
    const progress = Math.min(1,(now-startTime)/duration);
    const eased = 1-Math.pow(1-progress,3);
    window.scrollTo(0,startY+distance*eased);
    if (progress < 1) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

let state = {
  exercises: []
};


/* СИМВОЛ ВМЕСТО ПРОБЕЛОВ */

function starText(text) {
  return String(text).trim().replace(/\s+/g, "✶");
}


/* СЛУЧАЙНЫЙ ОСТРОВ */

function randomIsland() {

  const cells = [];

  const seed = Math.random() * 10000;

  const mode = Math.floor(Math.random() * 7);

  const blobs = [];

  const rand = (a,b) => a + Math.random() * (b-a);

  // Разные композиции

  let count = 1;

  if (mode === 1) count = 2;
  if (mode === 2) count = 3;
  if (mode === 3) count = 4;
  if (mode === 4) count = 2;
  if (mode === 5) count = 5;
  if (mode === 6) count = 3;

  // Основное направление территории

  let angle = rand(0,Math.PI*2);

  if (mode === 1) angle = 0;
  if (mode === 2) angle = Math.PI/2;
  if (mode === 3) angle = rand(0,Math.PI);
  if (mode === 4) angle = rand(0,Math.PI*2);

  const horizontal = Math.cos(angle);
  const vertical = Math.sin(angle);

  const centerX = 10.5;
  const centerY = 13.5;

  // Создание отдельных массивов

  for (let i=0;i<count;i++) {

    let t = count === 1 ? 0 : (i/(count-1)-.5);

    let x = centerX + horizontal*t*11;
    let y = centerY + vertical*t*15;

    if (mode === 5) {
      x += rand(-5,5);
      y += rand(-5,5);
    }

    if (mode === 6) {
      x += rand(-3,3);
      y += rand(-7,7);
    }

    const rx = rand(3.5,7.5);
    const ry = rand(3.5,8.5);

    blobs.push({
      x,
      y,
      rx,
      ry,
      rotation: rand(0,Math.PI*2),
      phase: rand(0,Math.PI*2),
      waves: rand(.08,.24),
      lobes: 2+Math.floor(Math.random()*5)
    });
  }

  // Иногда создаём длинную перемычку

  const bridge = mode === 1 || mode === 3 || mode === 6;

  function insideBlob(x,y,b) {

    const dx = x-b.x;
    const dy = y-b.y;

    const cos = Math.cos(b.rotation);
    const sin = Math.sin(b.rotation);

    const rx = dx*cos + dy*sin;
    const ry = -dx*sin + dy*cos;

    const nx = rx/b.rx;
    const ny = ry/b.ry;

    const angle = Math.atan2(ny,nx);

    const radius = Math.sqrt(nx*nx+ny*ny);

    const wave =
      b.waves*Math.sin(angle*b.lobes+b.phase) +
      b.waves*.45*Math.cos(angle*7-b.phase);

    return radius < .86 + wave;
  }

  function inside(x,y) {

    let result = false;

    for (const b of blobs) {
      if (insideBlob(x,y,b)) {
        result = true;
        break;
      }
    }

    if (!result && bridge && count > 1) {

      const dx = x-centerX;
      const dy = y-centerY;

      const along = dx*horizontal + dy*vertical;
      const across = -dx*vertical + dy*horizontal;

      if (
        Math.abs(along)<10 &&
        Math.abs(across)<1.25
      ) {
        result = true;
      }
    }

    // Неровность края

    if (result) {

      const noise =
        Math.sin(x*.9+seed)*.045 +
        Math.cos(y*.8-seed)*.045 +
        Math.sin((x+y)*.5+seed)*.035;

      if (Math.random() < .025) result=false;
      else if (noise < -.07 && Math.random()<.15) result=false;
    }

    return result;
  }

  for (let y=0;y<ROWS;y++) {
    for (let x=0;x<COLS;x++) {

      if (inside(x,y)) {
        cells.push([x,y,false]);
      }

    }
  }

  // Защита от слишком маленькой карты

  if (cells.length < 45) {
    return randomIsland();
  }

  return cells;
}


/* КОНТУР */

function makeOutline(cells) {

  const set = new Set(
    cells.map(c => `${c[0]},${c[1]}`)
  );

  const has = (x,y) => set.has(`${x},${y}`);

  const lines = [];

  for (const [x,y] of cells) {

    const x1 = x*CELL;
    const y1 = y*CELL;
    const x2 = x1+CELL;
    const y2 = y1+CELL;

    if (!has(x,y-1)) lines.push(`M${x1} ${y1}H${x2}`);
    if (!has(x+1,y)) lines.push(`M${x2} ${y1}V${y2}`);
    if (!has(x,y+1)) lines.push(`M${x2} ${y2}H${x1}`);
    if (!has(x-1,y)) lines.push(`M${x1} ${y2}V${y1}`);
  }

  return lines.join("");
}


/* СОХРАНЕНИЕ */

function save() {

  try {
    localStorage.setItem(KEY,JSON.stringify(state));
  } catch(e) {
    console.log("Ошибка сохранения",e);
  }
}


/* ПРОГРЕСС */

function getProgress(exercise) {

  const cells = exercise.maps.flatMap(m=>m.cells);

  if (!cells.length) return 0;

  const filled = cells.filter(c=>c[2]).length;

  return Math.floor(filled/cells.length*100);
}


/* ГЛАВНАЯ */

function renderHome() {

  list.replaceChildren();

  document.getElementById("exerciseCount").textContent =
    String(state.exercises.length).padStart(2,"0");

  state.exercises.forEach(exercise=>{

    const row = document.createElement("div");
    row.className = "exercise";

    const name = document.createElement("button");
    name.className = "exercise-name";
    name.type = "button";

    name.textContent = starText(exercise.name);

    name.onclick = ()=>openExercise(exercise.id);

    const percent = document.createElement("span");
    percent.className = "exercise-percent";
    percent.textContent = getProgress(exercise)+"%";

    const del = document.createElement("button");
    del.className = "row-action delete";
    del.type = "button";
    del.textContent = "×";

    del.onclick = ()=>{

      if (!confirm("Удалить упражнение?")) return;

      state.exercises = state.exercises.filter(
        e=>e.id!==exercise.id
      );

      save();
      renderHome();
    };

    row.append(name,percent,del);
    list.appendChild(row);
  });
}


/* ДОБАВЛЕНИЕ УПРАЖНЕНИЯ */

document.getElementById("addExercise").onclick = ()=>{

  const name = prompt("Название упражнения:");

  if (!name || !name.trim()) return;

  state.exercises.push({

    id: Date.now().toString()+
      Math.random().toString(36).slice(2),

    name: name.trim(),

    reps: 0,

    maps: [
      {cells:randomIsland()}
    ]

  });

  save();
  renderHome();
};


/* ТЕКУЩЕЕ УПРАЖНЕНИЕ */

function getCurrent() {

  return state.exercises.find(
    e=>e.id===currentId
  );
}


/* ОТКРЫТИЕ КАРТЫ */

function openExercise(id) {

  currentId = id;

  const exercise = getCurrent();

  if (!exercise) return;

  home.classList.add("hidden");
  workout.classList.remove("hidden");

  app.classList.add("view-map");

  document.getElementById("mapTitle").textContent =
    starText(exercise.name);

  renderWorkout();

  window.scrollTo(0,0);
}


/* РЕДАКТИРОВАНИЕ НАЗВАНИЯ В ЗАГОЛОВКЕ */

document.getElementById("editTitle").onclick = ()=>{
  const exercise = getCurrent();
  if (!exercise) return;

  const nextName = prompt("Новое название упражнения:",exercise.name);
  if (!nextName || !nextName.trim()) return;

  exercise.name = nextName.trim();
  document.getElementById("mapTitle").textContent = starText(exercise.name);
  save();
};


/* НАЗАД */

document.getElementById("back").onclick = ()=>{

  currentId = null;

  workout.classList.add("hidden");
  home.classList.remove("hidden");

  app.classList.remove("view-map");

  renderHome();

  window.scrollTo(0,0);
};


/* ОТРИСОВКА КАРТ */

function createMapSection(map,mapIndex) {
  const section = document.createElement("div");
  section.className = "map";

  const svg = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "svg"
  );

  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

  map.cells.forEach((cell,i)=>{
    const rect = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

    // Едва смягчаем внешний силуэт острова, сохраняя плотную сетку без щелей.
    rect.setAttribute("x",cell[0]*CELL - 0.25);
    rect.setAttribute("y",cell[1]*CELL - 0.25);
    rect.setAttribute("width",CELL + 0.5);
    rect.setAttribute("height",CELL + 0.5);
    rect.setAttribute("rx","1.15");
    rect.setAttribute("ry","1.15");
    rect.setAttribute("class",cell[2]?"cell filled":"cell");
    rect.dataset.cell = i;
    svg.appendChild(rect);
  });

  const outline = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "path"
  );

  outline.setAttribute("d",makeOutline(map.cells));
  outline.setAttribute("class","outline");
  svg.appendChild(outline);

  // Определяем ячейку по координатам касания, а не по event.target.
  svg.addEventListener("pointerdown",event=>{
    const box = svg.getBoundingClientRect();
    if (!box.width || !box.height) return;

    const x = Math.floor((event.clientX - box.left) / box.width * COLS);
    const y = Math.floor((event.clientY - box.top) / box.height * ROWS);
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

    const cellIndex = map.cells.findIndex(
      cell => cell[0] === x && cell[1] === y
    );

    if (cellIndex < 0) return;
    event.preventDefault();
    addRep(mapIndex,cellIndex);
  });

  section.appendChild(svg);
  return section;
}

function renderWorkout() {
  const exercise = getCurrent();
  if (!exercise) return;

  mapsEl.replaceChildren();
  exercise.maps.forEach((map,mapIndex)=>{
    mapsEl.appendChild(createMapSection(map,mapIndex));
  });

  updateInfo();
}

/* СЛУЧАЙНЫЙ НОВЫЙ КОНТУР С СОХРАНЕНИЕМ ОТМЕТОК */

function rerollLargestMap() {

  const exercise = getCurrent();
  if (!exercise) return;

  if (!exercise.maps.length) {
    exercise.maps.push({cells:randomIsland()});
    save();
    renderWorkout();
    return;
  }

  // Меняем только самый крупный контур по количеству ячеек.
  let mapIndex = 0;
  for (let i=1;i<exercise.maps.length;i++) {
    if (exercise.maps[i].cells.length > exercise.maps[mapIndex].cells.length) {
      mapIndex = i;
    }
  }

  const oldMap = exercise.maps[mapIndex];
  if (!oldMap) return;

  const filledCount = oldMap.cells.filter(cell=>cell[2]).length;

  // Создаём новый остров и переносим на него все отметки.
  const replacement = {cells:randomIsland()};
  const firstBatch = Math.min(filledCount,replacement.cells.length);

  for (let i=0;i<firstBatch;i++) {
    replacement.cells[i][2] = true;
  }

  let remaining = filledCount-firstBatch;
  const overflowMaps = [];

  // Если новый остров меньше числа уже отмеченных ячеек,
  // остаток переносится на дополнительные полностью/частично заполненные карты.
  while (remaining > 0) {
    const nextMap = {cells:randomIsland()};
    const batch = Math.min(remaining,nextMap.cells.length);

    for (let i=0;i<batch;i++) {
      nextMap.cells[i][2] = true;
    }

    remaining -= batch;
    overflowMaps.push(nextMap);
  }

  exercise.maps.splice(mapIndex,1,replacement,...overflowMaps);

  save();
  renderWorkout();
}

document.getElementById("rerollLargest").onclick = rerollLargestMap;



/* ПОВТОРЕНИЯ */

function addRep(mapIndex,cellIndex) {

  const exercise = getCurrent();

  if (!exercise) return;

  const map = exercise.maps[mapIndex];
  const cell = map?.cells[cellIndex];

  if (!cell) return;

  if (cell[2]) {

    cell[2] = false;

    exercise.reps = Math.max(
      0,
      exercise.reps-1
    );

  } else {

    cell[2] = true;
    exercise.reps++;
  }

  // Если контур полностью опустел, убираем его из карты.
  if (!cell[2] && map.cells.every(c=>!c[2])) {
    exercise.maps.splice(mapIndex,1);
    renderWorkout();
    updateInfo();
    save();
    return;
  }

  const svg = mapsEl.children[mapIndex]?.querySelector("svg");

  const rect = svg?.querySelector(
    `[data-cell="${cellIndex}"]`
  );

  if (rect) {
    // Меняется только плотность самой клетки — без дополнительных эффектов.
    rect.classList.toggle("filled",cell[2]);
  }

  if (cell[2]) playTone(520, .045, .016);

  const lastMap = exercise.maps[exercise.maps.length-1];

  if (
    lastMap.cells.every(c=>c[2]) &&
    mapIndex===exercise.maps.length-1
  ) {

    const completedSection = mapsEl.children[mapIndex];
    if (completedSection) {
      completedSection.classList.add("just-claimed");
      window.setTimeout(
        ()=>completedSection.classList.remove("just-claimed"),
        700
      );
    }

    const nextMap = {cells:randomIsland()};
    exercise.maps.push(nextMap);

    const nextSection = createMapSection(nextMap,exercise.maps.length-1);
    mapsEl.appendChild(nextSection);

    // Камера спокойно переходит к новой территории; предыдущая остаётся выше.
    requestAnimationFrame(()=>scrollToNewMap(nextSection));
  }

  updateInfo();
  save();
}


/* ИНФОРМАЦИЯ */

function updateAnimatedValue(element, value) {
  const next = String(value);
  if (element.textContent === next) return;

  element.textContent = next;
  element.classList.remove("count-change");
  // Перезапускаем короткую анимацию только у изменившейся цифры.
  void element.offsetWidth;
  element.classList.add("count-change");
}

function updateInfo() {

  const exercise = getCurrent();

  if (!exercise) return;

  updateAnimatedValue(
    document.getElementById("mapPercent"),
    getProgress(exercise)+"%"
  );

  updateAnimatedValue(
    document.getElementById("totalReps"),
    String(exercise.reps).padStart(3,"0")
  );

  save();
}


/* ЗАГРУЗКА */

try {

  const saved = JSON.parse(
    localStorage.getItem(KEY)
  );

  if (saved && Array.isArray(saved.exercises)) {
    state = saved;
  }

} catch(e) {}


/* МИГРАЦИЯ СТАРОЙ ВЕРСИИ */

if (!state.exercises.length) {

  try {

    const old = JSON.parse(
      localStorage.getItem("workout-map-v1")
    );

    if (old && Array.isArray(old.maps)) {

      state.exercises.push({

        id:"old-workout",
        name:"Тренировка",
        reps:old.total||0,
        maps:old.maps

      });
    }

  } catch(e) {}
}


/* ЗАПУСК */

renderHome();
save();

})();
</script>

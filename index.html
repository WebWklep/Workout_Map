<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>CLAIM BY POWER</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --paper: #ffffff;
  --ink: #353430;
  --soft: #85847e;
  --line: #aaa9a2;
  --cell: #55534f;
}

html {
  background: var(--paper);
  overflow-x: hidden;
}

body {
  overflow-x: hidden;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #ffffff;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
}

/* Чистая бумажная основа с очень деликатным печатным зерном */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  opacity: .065;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)' opacity='.34'/%3E%3C/svg%3E");
  background-size: 180px 180px;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#app {
  min-height: 100vh;
  padding: 25px 20px;
  position: relative;
  z-index: 1;
}

.hidden {
  display: none !important;
}

/* ТИПОГРАФИКА */

.topline,
.map-title,
.map-info,
.footer,
.exercise {
  font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  font-stretch: normal;
  letter-spacing: -.2px;
}

.topline {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 38px;
  color: #4b4a45;
  text-shadow: none;
}

.brand-lockup {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  line-height: 1;
}

.brand-main {
  font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  font-size: 25px;
  line-height: .9;
  font-weight: 700;
  letter-spacing: -.055em;
}

.brand-sub {
  margin-top: 4px;
  font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  font-size: 9px;
  line-height: 1;
  font-weight: 600;
  letter-spacing: .31em;
  color: #85817a;
}

#exerciseCount {
  padding-top: 2px;
  font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .02em;
  color: #77746e;
}

#exerciseList {
  display: flex;
  flex-direction: column;
}

.exercise {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto 38px;
  align-items: center;
  gap: 6px;
  padding: 0;
  border-bottom: 0;
  line-height: 1.05;
}

.exercise-name {
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -.25px;
  line-height: 1.05;
  text-transform: uppercase;
  text-align: left;
  overflow-wrap: anywhere;
  padding: 5px 0;
  color: #383732;
  text-shadow: none;
}

.exercise-percent {
  font-size: 13px;
  color: #85847e;
}

.row-action {
  display: grid;
  place-items: center;
  width: 38px;
  height: 40px;
  font-size: 20px;
  color: #85847e;
}

.delete {
  font-size: 21px;
  color: #999890;
}

.edit-title {
  display: grid;
  place-items: center;
  width: 36px;
  height: 40px;
  margin-left: auto;
  flex: 0 0 36px;
  color: #77766f;
  font-size: 18px;
}

.reroll-map {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #222;
  font-size: 23px;
  line-height: 1;
  box-shadow: none;
  -webkit-appearance: none;
  appearance: none;
}

.map-progress-value {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 0 auto;
}

.add {
  display: block;
  width: 48px;
  height: 48px;
  margin-top: 20px;
  padding: 0;
  font-size: 27px;
  color: #65645e;
  text-align: left;
  position: relative;
  z-index: 5;
}

/* КАРТА */

#app.view-map {
  padding-left: 4px;
  padding-right: 4px;
}

.map-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 13px 28px;
}

.back {
  font-size: 23px;
  width: 44px;
  height: 44px;
  text-align: left;
  color: #55544e;
}

.map-title {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -.25px;
  overflow-wrap: anywhere;
  text-shadow: none;
  min-width: 0;
  flex: 1;
}

.map-info {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 13px 20px;
  font-size: 13px;
  font-weight: 500;
  color: #85847c;
  letter-spacing: -.15px;
}

.map-progress-value {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: -2px;
}

.reroll-map {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #222;
  font-size: 22px;
  line-height: 1;
  box-shadow: none;
  -webkit-appearance: none;
  appearance: none;
}

.reroll-map:focus,
.reroll-map:active {
  outline: none;
  background: transparent;
}

#maps {
  display: flex;
  flex-direction: column;
  gap: 30px;
  width: 112%;
  margin-left: -6%;
}

.map {
  width: 100%;
  position: relative;
}

.map svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  touch-action: manipulation;
  filter: none;
}

/* КЛЕТКИ */

.cell {
  fill: transparent;
}

.cell.filled {
  fill: var(--cell);
}

/* Рваная графитовая кромка — будто слой земли слегка выступает из-под сетки */
.earth-dust { display: none; }

/* Клетка немного крупнее, чтобы по ней было удобнее попадать */
#maps { touch-action: pan-y; }

/* Чёрная заливка плавно растворяется, открывая спутниковый рельеф */
.terrain-reveal {
  fill: #292826;
  opacity: 1;
  pointer-events: none;
  animation: terrainUncover .72s cubic-bezier(.2,.65,.25,1) forwards;
}
.terrain-hide {
  animation: terrainFadeOut .62s cubic-bezier(.35,0,.7,.35) forwards;
  pointer-events: none;
}
@keyframes terrainFadeOut {
  0% { opacity: 1; filter: brightness(1); }
  55% { opacity: .58; filter: brightness(1.35); }
  100% { opacity: 0; filter: brightness(1.8); }
}
@keyframes terrainUncover {
  0% { opacity: 1; }
  28% { opacity: .94; }
  100% { opacity: 0; }
}

/* Мягкое появление заполненной клетки */
.cell.cell-pop {
  transform-box: fill-box;
  transform-origin: center;
  animation: cellFill .22s cubic-bezier(.2,.8,.25,1) both;
}

@keyframes cellFill {
  0% { opacity: .35; transform: scale(.58); }
  72% { opacity: 1; transform: scale(1.08); }
  100% { opacity: 1; transform: scale(1); }
}

/* Секретный экран завершения карты */
.completion-flash {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  background: #fff;
  color: #353430;
  opacity: 0;
  pointer-events: none;
  animation: completionFlash 1.65s ease both;
}

.completion-flash span {
  font-size: clamp(22px, 6vw, 29px);
  font-weight: 600;
  letter-spacing: .16em;
  animation: completionText 1.9s ease both;
}

@keyframes completionFlash {
  0%,100% { opacity: 0; }
  18%,76% { opacity: 1; }
}

@keyframes completionText {
  0% { opacity: 0; filter: brightness(.45) blur(3px); transform: scale(.96); }
  30% { opacity: 1; filter: brightness(1.55) blur(0); transform: scale(1.025); text-shadow: 0 0 18px rgba(53,52,48,.18); }
  48%,70% { opacity: 1; filter: brightness(1) blur(0); transform: scale(1); text-shadow: 0 0 0 rgba(53,52,48,0); }
  100% { opacity: 0; filter: brightness(.7) blur(2px); transform: scale(1.015); }
}

/* КОНТУР */

.outline {
  pointer-events: none;
  fill: none;
  stroke: #77746e;
  stroke-width: 1;
  stroke-linejoin: miter;
  vector-effect: non-scaling-stroke;
  filter: none;
}

.footer {
  position: fixed;
  left: 13px;
  bottom: max(12px, env(safe-area-inset-bottom));
  margin: 0;
  display: flex;
  justify-content: flex-start;
  gap: 9px;
  font-size: 13px;
  color: #77766f;
  letter-spacing: -.3px;
  z-index: 20;
}

#totalReps {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .2px;
  font-variant-numeric: tabular-nums;
}

button:active {
  opacity: .65;
}
</style>
</head>

<body>

<div id="app">

<section id="home">

  <div class="topline">
    <div class="brand-lockup" aria-label="Claim by Power">
      <span class="brand-main">CLAIM</span>
      <span class="brand-sub">BY POWER</span>
    </div>
    <span id="exerciseCount">00</span>
  </div>

  <div id="exerciseList"></div>

  <button class="add" id="addExercise" type="button">+</button>

</section>

<section id="workout" class="hidden">

  <div class="map-header">
    <button class="back" id="back" type="button">←</button>
    <span class="map-title" id="mapTitle"></span>
    <button class="edit-title" id="editTitle" type="button" aria-label="Изменить название">✎</button>
  </div>

  <div class="map-info">
    <span>MAP✶PROGRESS <span id="mapPercent">0%</span></span>
    <button class="reroll-map" id="rerollLargest" type="button" aria-label="Сменить самый большой контур" title="Сменить самый большой контур">⚄</button>
  </div>

  <div id="maps"></div>

  <div class="footer">
    <span>TOTAL✶REPS</span>
    <span id="totalReps">000</span>
  </div>

</section>

</div>

<script>
(() => {

const COLS = 18;
const ROWS = 22;
const CELL = 24;

const W = COLS * CELL;
const H = ROWS * CELL;

const KEY = "workout-map-v2";

const app = document.getElementById("app");
const home = document.getElementById("home");
const workout = document.getElementById("workout");
const list = document.getElementById("exerciseList");
const mapsEl = document.getElementById("maps");

let currentId = null;
let audioContext = null;

function playTone(frequency = 520, duration = 0.045, volume = 0.018) {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    audioContext ||= new AudioContextClass();
    if (audioContext.state === "suspended") audioContext.resume();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
    gain.gain.setValueAtTime(volume, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  } catch (e) {}
}

function showMapComplete() {
  const flash = document.createElement("div");
  flash.className = "completion-flash";
  const label = document.createElement("span");
  label.textContent = "REGION COMPLETE";
  flash.appendChild(label);
  document.body.appendChild(flash);
  flash.addEventListener("animationend", () => flash.remove(), {once:true});
  playTone(660, .12, .025);
  window.setTimeout(() => flash.remove(), 1800);
}

let state = {
  exercises: []
};


/* СИМВОЛ ВМЕСТО ПРОБЕЛОВ */

function starText(text) {
  return String(text).trim().replace(/\s+/g, "✶");
}


/* СЛУЧАЙНЫЙ ОСТРОВ */

function randomIsland() {

  const cells = [];

  const seed = Math.random() * 10000;

  const mode = Math.floor(Math.random() * 7);

  const blobs = [];

  const rand = (a,b) => a + Math.random() * (b-a);

  // Разные композиции

  let count = 1;

  if (mode === 1) count = 2;
  if (mode === 2) count = 3;
  if (mode === 3) count = 4;
  if (mode === 4) count = 2;
  if (mode === 5) count = 5;
  if (mode === 6) count = 3;

  // Основное направление территории

  let angle = rand(0,Math.PI*2);

  if (mode === 1) angle = 0;
  if (mode === 2) angle = Math.PI/2;
  if (mode === 3) angle = rand(0,Math.PI);
  if (mode === 4) angle = rand(0,Math.PI*2);

  const horizontal = Math.cos(angle);
  const vertical = Math.sin(angle);

  const centerX = (COLS-1)/2;
  const centerY = (ROWS-1)/2;

  // Создание отдельных массивов

  for (let i=0;i<count;i++) {

    let t = count === 1 ? 0 : (i/(count-1)-.5);

    let x = centerX + horizontal*t*8.5;
    let y = centerY + vertical*t*10.5;

    if (mode === 5) {
      x += rand(-3.5,3.5);
      y += rand(-5,5);
    }

    if (mode === 6) {
      x += rand(-3,3);
      y += rand(-4.5,4.5);
    }

    const rx = rand(3.1,6.2);
    const ry = rand(3.1,7.1);

    blobs.push({
      x,
      y,
      rx,
      ry,
      rotation: rand(0,Math.PI*2),
      phase: rand(0,Math.PI*2),
      waves: rand(.08,.24),
      lobes: 2+Math.floor(Math.random()*5)
    });
  }

  // Иногда создаём длинную перемычку

  const bridge = mode === 1 || mode === 3 || mode === 6;

  function insideBlob(x,y,b) {

    const dx = x-b.x;
    const dy = y-b.y;

    const cos = Math.cos(b.rotation);
    const sin = Math.sin(b.rotation);

    const rx = dx*cos + dy*sin;
    const ry = -dx*sin + dy*cos;

    const nx = rx/b.rx;
    const ny = ry/b.ry;

    const angle = Math.atan2(ny,nx);

    const radius = Math.sqrt(nx*nx+ny*ny);

    const wave =
      b.waves*Math.sin(angle*b.lobes+b.phase) +
      b.waves*.45*Math.cos(angle*7-b.phase);

    return radius < .86 + wave;
  }

  function inside(x,y) {

    let result = false;

    for (const b of blobs) {
      if (insideBlob(x,y,b)) {
        result = true;
        break;
      }
    }

    if (!result && bridge && count > 1) {

      const dx = x-centerX;
      const dy = y-centerY;

      const along = dx*horizontal + dy*vertical;
      const across = -dx*vertical + dy*horizontal;

      if (
        Math.abs(along)<7.8 &&
        Math.abs(across)<1.25
      ) {
        result = true;
      }
    }

    // Неровность края

    if (result) {

      const noise =
        Math.sin(x*.9+seed)*.045 +
        Math.cos(y*.8-seed)*.045 +
        Math.sin((x+y)*.5+seed)*.035;

      if (Math.random() < .025) result=false;
      else if (noise < -.07 && Math.random()<.15) result=false;
    }

    return result;
  }

  for (let y=0;y<ROWS;y++) {
    for (let x=0;x<COLS;x++) {

      if (inside(x,y)) {
        cells.push([x,y,false]);
      }

    }
  }

  // Защита от слишком маленькой карты

  if (cells.length < 30) {
    return randomIsland();
  }

  return cells;
}


/* КОНТУР */

function makeOutline(cells) {

  const set = new Set(
    cells.map(c => `${c[0]},${c[1]}`)
  );

  const has = (x,y) => set.has(`${x},${y}`);

  const lines = [];

  for (const [x,y] of cells) {

    const x1 = x*CELL;
    const y1 = y*CELL;
    const x2 = x1+CELL;
    const y2 = y1+CELL;

    if (!has(x,y-1)) lines.push(`M${x1} ${y1}H${x2}`);
    if (!has(x+1,y)) lines.push(`M${x2} ${y1}V${y2}`);
    if (!has(x,y+1)) lines.push(`M${x2} ${y2}H${x1}`);
    if (!has(x-1,y)) lines.push(`M${x1} ${y2}V${y1}`);
  }

  return lines.join("");
}


/* СОХРАНЕНИЕ */

function save() {

  try {
    localStorage.setItem(KEY,JSON.stringify(state));
  } catch(e) {
    console.log("Ошибка сохранения",e);
  }
}


/* ПРОГРЕСС */

function getProgress(exercise) {

  const cells = exercise.maps.flatMap(m=>m.cells);

  if (!cells.length) return 0;

  const filled = cells.filter(c=>c[2]).length;

  return Math.floor(filled/cells.length*100);
}


/* ГЛАВНАЯ */

function renderHome() {

  list.replaceChildren();

  document.getElementById("exerciseCount").textContent =
    String(state.exercises.length).padStart(2,"0");

  state.exercises.forEach(exercise=>{

    const row = document.createElement("div");
    row.className = "exercise";

    const name = document.createElement("button");
    name.className = "exercise-name";
    name.type = "button";

    name.textContent = starText(exercise.name);

    name.onclick = ()=>openExercise(exercise.id);

    const percent = document.createElement("span");
    percent.className = "exercise-percent";
    percent.textContent = getProgress(exercise)+"%";

    const del = document.createElement("button");
    del.className = "row-action delete";
    del.type = "button";
    del.textContent = "×";

    del.onclick = ()=>{

      if (!confirm("Удалить упражнение?")) return;

      state.exercises = state.exercises.filter(
        e=>e.id!==exercise.id
      );

      save();
      renderHome();
    };

    row.append(name,percent,del);
    list.appendChild(row);
  });
}


/* ДОБАВЛЕНИЕ УПРАЖНЕНИЯ */

document.getElementById("addExercise").onclick = ()=>{

  const name = prompt("Название упражнения:");

  if (!name || !name.trim()) return;

  state.exercises.push({

    id: Date.now().toString()+
      Math.random().toString(36).slice(2),

    name: name.trim(),

    reps: 0,

    maps: [
      {cells:randomIsland()}
    ]

  });

  save();
  renderHome();
};


/* ТЕКУЩЕЕ УПРАЖНЕНИЕ */

function getCurrent() {

  return state.exercises.find(
    e=>e.id===currentId
  );
}


/* ОТКРЫТИЕ КАРТЫ */

function openExercise(id) {

  currentId = id;

  const exercise = getCurrent();

  if (!exercise) return;

  home.classList.add("hidden");
  workout.classList.remove("hidden");

  app.classList.add("view-map");

  document.getElementById("mapTitle").textContent =
    starText(exercise.name);

  renderWorkout();

  window.scrollTo(0,0);
}


/* РЕДАКТИРОВАНИЕ НАЗВАНИЯ В ЗАГОЛОВКЕ */

document.getElementById("editTitle").onclick = ()=>{
  const exercise = getCurrent();
  if (!exercise) return;

  const nextName = prompt("Новое название упражнения:",exercise.name);
  if (!nextName || !nextName.trim()) return;

  exercise.name = nextName.trim();
  document.getElementById("mapTitle").textContent = starText(exercise.name);
  save();
};


/* НАЗАД */

document.getElementById("back").onclick = ()=>{

  currentId = null;

  workout.classList.add("hidden");
  home.classList.remove("hidden");

  app.classList.remove("view-map");

  renderHome();

  window.scrollTo(0,0);
};


/* ПРОЦЕДУРНЫЙ РЕЛЬЕФ: непрерывная высотная карта с имитацией спутникового hillshade */
function makeTerrainTexture(seed = 9137) {
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d", {willReadFrequently:true});
  const image = ctx.createImageData(W,H);

  function hash(ix,iy) {
    let n = ix*374761393 + iy*668265263 + seed*1442695041;
    n = (n ^ (n >>> 13)) * 1274126177;
    return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
  }
  function smooth(t) { return t*t*(3-2*t); }
  function noise(x,y) {
    const ix=Math.floor(x), iy=Math.floor(y);
    const fx=smooth(x-ix), fy=smooth(y-iy);
    const a=hash(ix,iy), b=hash(ix+1,iy);
    const c=hash(ix,iy+1), d=hash(ix+1,iy+1);
    const top=a+(b-a)*fx, bottom=c+(d-c)*fx;
    return top+(bottom-top)*fy;
  }
  function heightAt(x,y) {
    // Искажаем координаты, чтобы хребты были похожи на реальные горные цепи.
    const warpX = (noise(x/95+12,y/95+8)-.5)*30;
    const warpY = (noise(x/95+28,y/95+3)-.5)*30;
    const wx = x+warpX, wy = y+warpY;
    const broad = noise(wx/105+4,wy/105+7);
    const mid = noise(wx/43+19,wy/43+3);
    const fine = noise(wx/17+2,wy/17+23);
    const ridgeNoise = noise(wx/54+31,wy/54+11)*2-1;
    const ridges = Math.pow(1-Math.abs(ridgeNoise),2.15);
    const sharpRidges = Math.pow(1-Math.abs(noise(wx/27+7,wy/27+41)*2-1),3.1);
    return broad*.27 + mid*.25 + fine*.10 + ridges*.25 + sharpRidges*.13;
  }

  const heights = new Float32Array(W*H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) heights[y*W+x]=heightAt(x,y);

  for(let y=0;y<H;y++) for(let x=0;x<W;x++) {
    const at=(xx,yy)=>heights[Math.max(0,Math.min(H-1,yy))*W+Math.max(0,Math.min(W-1,xx))];
    const h=heights[y*W+x];
    const dx=at(x+1,y)-at(x-1,y);
    const dy=at(x,y+1)-at(x,y-1);
    // Свет сверху-слева: склоны читаются как рельеф, а не как шум.
    const slope = (-dx*.82-dy*1.18);
    const shade=Math.max(-.78,Math.min(.78,slope*12.5));
    const ridgeDetail=(noise(x/8+seed,y/8+seed)-.5)*13;
    const micro=(noise(x/3.1+seed*2,y/3.1+seed*2)-.5)*4;
    // Усиливаем разницу между вершинами и ущельями, добавляем читаемые склоны.
    const valley=Math.max(0,.48-h)*22;
    const value=Math.max(18,Math.min(246,145+(h-.5)*205+shade*155-valley+ridgeDetail+micro));
    const i=(y*W+x)*4;
    image.data[i]=value;
    image.data[i+1]=value;
    image.data[i+2]=value;
    image.data[i+3]=255;
  }
  ctx.putImageData(image,0,0);
  return canvas.toDataURL("image/png");
}

/* ОТРИСОВКА КАРТ */

function renderWorkout() {

  const exercise = getCurrent();

  if (!exercise) return;

  mapsEl.replaceChildren();

  exercise.maps.forEach((map,mapIndex)=>{

    const section = document.createElement("div");
    section.className = "map";

    const svg = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );

    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

    const defs = document.createElementNS("http://www.w3.org/2000/svg","defs");
    const terrainPatternId = `terrainPattern-${mapIndex}`;
    const terrainUrl = makeTerrainTexture(9137 + mapIndex * 7919);
    const pattern = document.createElementNS("http://www.w3.org/2000/svg","pattern");
    pattern.setAttribute("id",terrainPatternId);
    pattern.setAttribute("patternUnits","userSpaceOnUse");
    pattern.setAttribute("x","0");
    pattern.setAttribute("y","0");
    pattern.setAttribute("width",W);
    pattern.setAttribute("height",H);
    const terrainImage = document.createElementNS("http://www.w3.org/2000/svg","image");
    terrainImage.setAttribute("href",terrainUrl);
    terrainImage.setAttribute("x","0");
    terrainImage.setAttribute("y","0");
    terrainImage.setAttribute("width",W);
    terrainImage.setAttribute("height",H);
    pattern.appendChild(terrainImage);
    defs.appendChild(pattern);
    svg.appendChild(defs);

    map.cells.forEach((cell,i)=>{

      const rect = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "rect"
      );

      rect.setAttribute("x",cell[0]*CELL);
      rect.setAttribute("y",cell[1]*CELL);
      rect.setAttribute("width",CELL);
      rect.setAttribute("height",CELL);

      rect.setAttribute(
        "class",
        cell[2]?"cell filled":"cell"
      );
      if (cell[2]) rect.style.fill = `url(#${terrainPatternId})`;

      rect.dataset.cell = i;

      svg.appendChild(rect);
    });

    const outline = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    outline.setAttribute("d",makeOutline(map.cells));
    outline.setAttribute("class","outline");

    // Только тонкая, почти незаметная граница территории — без жирной обводки.
    outline.setAttribute("stroke","#8d8a84");
    outline.setAttribute("stroke-width",".55");
    outline.setAttribute("opacity",".42");
    svg.appendChild(outline);

    // Определяем ячейку по координатам касания, а не по event.target.
    // Это исключает промахи из-за SVG-контура и особенностей мобильного браузера.
    svg.addEventListener("pointerdown",event=>{

      const box = svg.getBoundingClientRect();

      if (!box.width || !box.height) return;

      const x = Math.floor((event.clientX - box.left) / box.width * COLS);
      const y = Math.floor((event.clientY - box.top) / box.height * ROWS);

      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

      const cellIndex = map.cells.findIndex(
        cell => cell[0] === x && cell[1] === y
      );

      if (cellIndex < 0) return;

      event.preventDefault();
      addRep(mapIndex,cellIndex);
    });

    section.appendChild(svg);
    mapsEl.appendChild(section);
  });

  updateInfo();
}


/* СЛУЧАЙНЫЙ НОВЫЙ КОНТУР С СОХРАНЕНИЕМ ОТМЕТОК */

function rerollLargestMap() {

  const exercise = getCurrent();
  if (!exercise) return;

  if (!exercise.maps.length) {
    exercise.maps.push({cells:randomIsland()});
    save();
    renderWorkout();
    return;
  }

  // Меняем только самый крупный контур по количеству ячеек.
  let mapIndex = 0;
  for (let i=1;i<exercise.maps.length;i++) {
    if (exercise.maps[i].cells.length > exercise.maps[mapIndex].cells.length) {
      mapIndex = i;
    }
  }

  const oldMap = exercise.maps[mapIndex];
  if (!oldMap) return;

  const filledCount = oldMap.cells.filter(cell=>cell[2]).length;

  // Создаём новый остров и переносим на него все отметки.
  const replacement = {cells:randomIsland()};
  const firstBatch = Math.min(filledCount,replacement.cells.length);

  for (let i=0;i<firstBatch;i++) {
    replacement.cells[i][2] = true;
  }

  let remaining = filledCount-firstBatch;
  const overflowMaps = [];

  // Если новый остров меньше числа уже отмеченных ячеек,
  // остаток переносится на дополнительные полностью/частично заполненные карты.
  while (remaining > 0) {
    const nextMap = {cells:randomIsland()};
    const batch = Math.min(remaining,nextMap.cells.length);

    for (let i=0;i<batch;i++) {
      nextMap.cells[i][2] = true;
    }

    remaining -= batch;
    overflowMaps.push(nextMap);
  }

  exercise.maps.splice(mapIndex,1,replacement,...overflowMaps);

  save();
  renderWorkout();
}

document.getElementById("rerollLargest").onclick = rerollLargestMap;



/* ПОВТОРЕНИЯ */

function addRep(mapIndex,cellIndex) {

  const exercise = getCurrent();

  if (!exercise) return;

  const map = exercise.maps[mapIndex];
  const cell = map?.cells[cellIndex];

  if (!cell) return;

  if (cell[2]) {

    cell[2] = false;

    exercise.reps = Math.max(
      0,
      exercise.reps-1
    );

  } else {

    cell[2] = true;
    exercise.reps++;
  }

  // Если контур полностью опустел, убираем его из карты.
  if (!cell[2] && map.cells.every(c=>!c[2])) {
    exercise.maps.splice(mapIndex,1);
    renderWorkout();
    updateInfo();
    save();
    return;
  }

  const svg = mapsEl.children[mapIndex]?.querySelector("svg");

  const rect = svg?.querySelector(
    `[data-cell="${cellIndex}"]`
  );

  if (rect) {
    rect.setAttribute(
      "class",
      cell[2] ? "cell filled cell-pop" : "cell"
    );
    rect.style.filter = "";
    if (cell[2]) {
      rect.style.fill = `url(#terrainPattern-${mapIndex})`;
      rect.classList.remove("terrain-hide");
      // Чёрная поверхность растворяется, открывая рельеф под ней.
      const reveal = document.createElementNS("http://www.w3.org/2000/svg","rect");
      reveal.setAttribute("x",cell[0]*CELL);
      reveal.setAttribute("y",cell[1]*CELL);
      reveal.setAttribute("width",CELL);
      reveal.setAttribute("height",CELL);
      reveal.setAttribute("class","terrain-reveal");
      svg.appendChild(reveal);
      reveal.addEventListener("animationend",()=>reveal.remove(),{once:true});
    } else {
      // При снятии отметки рельеф выцветает обратно в белую бумагу.
      rect.classList.remove("terrain-hide");
      void rect.getBoundingClientRect();
      rect.classList.add("terrain-hide");
      rect.addEventListener("animationend",()=>{
        if (!cell[2]) rect.style.fill = "transparent";
        rect.classList.remove("terrain-hide");
      },{once:true});
    }
  }

  if (cell[2]) playTone(520, .045, .016);

  const lastMap = exercise.maps[exercise.maps.length-1];

  if (
    lastMap.cells.every(c=>c[2]) &&
    mapIndex===exercise.maps.length-1
  ) {

    showMapComplete();
    exercise.maps.push({
      cells:randomIsland()
    });

    renderWorkout();
  }

  updateInfo();
  save();
}


/* ИНФОРМАЦИЯ */

function updateInfo() {

  const exercise = getCurrent();

  if (!exercise) return;

  document.getElementById("mapPercent").textContent =
    getProgress(exercise)+"%";

  document.getElementById("totalReps").textContent =
    String(exercise.reps).padStart(3,"0");

  save();
}


/* ЗАГРУЗКА */

try {

  const saved = JSON.parse(
    localStorage.getItem(KEY)
  );

  if (saved && Array.isArray(saved.exercises)) {
    state = saved;
  }

} catch(e) {}


/* МИГРАЦИЯ СТАРОЙ ВЕРСИИ */

if (!state.exercises.length) {

  try {

    const old = JSON.parse(
      localStorage.getItem("workout-map-v1")
    );

    if (old && Array.isArray(old.maps)) {

      state.exercises.push({

        id:"old-workout",
        name:"Тренировка",
        reps:old.total||0,
        maps:old.maps

      });
    }

  } catch(e) {}
}


/* МИГРАЦИЯ СЕТКИ: уменьшаем число ячеек, сохраняя расположение и отметки */
if (state.gridVersion !== 2) {
  for (const exercise of state.exercises) {
    for (const map of (exercise.maps || [])) {
      const remapped = new Map();
      for (const cell of (map.cells || [])) {
        const x = Math.max(0,Math.min(COLS-1,Math.round(cell[0] * (COLS-1) / 21)));
        const y = Math.max(0,Math.min(ROWS-1,Math.round(cell[1] * (ROWS-1) / 27)));
        const key = x + "," + y;
        if (!remapped.has(key)) remapped.set(key,[x,y,!!cell[2]]);
        else if (cell[2]) remapped.get(key)[2] = true;
      }
      map.cells = [...remapped.values()];
    }
    exercise.reps = (exercise.maps || []).reduce(
      (sum,map)=>sum+(map.cells || []).filter(cell=>cell[2]).length,0
    );
  }
  state.gridVersion = 2;
}

/* ЗАПУСК */

renderHome();
save();

})();
</script>

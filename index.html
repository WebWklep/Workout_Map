<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eeede8">
<title>UNFOG</title>

<style>
*{box-sizing:border-box}

:root{
  --paper:#eeede8;
  --ink:#302f2c;
  --soft:#85847d;
  --line:#cecdc6;
  --cell:#30302e;
}

html{background:var(--paper)}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:"Courier New",monospace;
  background:
    radial-gradient(ellipse at 15% 10%,#fff 0%,transparent 45%),
    radial-gradient(ellipse at 85% 65%,rgba(255,255,255,.65),transparent 50%),
    linear-gradient(145deg,#f1f0eb,#e9e8e2);
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* ПЛЁНОЧНОЕ ЗЕРНО */

body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  opacity:.15;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
}

/* ОБЩАЯ МОЛОЧНАЯ ДЫМКА */

body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:19;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 15%,rgba(255,255,255,.35),transparent 55%),
    radial-gradient(ellipse at 10% 80%,rgba(255,255,255,.25),transparent 50%);
}

button{
  font:inherit;
  color:inherit;
  border:0;
  background:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

#app{
  min-height:100vh;
  padding:24px 18px;
}

.hidden{display:none!important}

/* ГЛАВНАЯ */

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:38px;
  font-size:13px;
  letter-spacing:2px;
  color:#484741;
  text-shadow:0 0 1px rgba(50,50,45,.4);
}

#exerciseList{
  display:flex;
  flex-direction:column;
}

.exercise{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto 44px;
  align-items:center;
  gap:12px;
  padding:17px 0;
  border-bottom:1px solid rgba(100,99,92,.25);
}

.exercise-name{
  font-size:15px;
  text-align:left;
  overflow-wrap:anywhere;
  padding:10px 0;
  color:#343430;
  text-shadow:0 0 1px rgba(50,50,45,.3);
}

.exercise-percent{
  font-size:13px;
  color:#85847c;
}

.delete{
  font-size:20px;
  color:#a09f97;
  width:44px;
  height:44px;
}

.add{
  display:block;
  width:48px;
  height:48px;
  margin-top:20px;
  padding:0;
  font-size:27px;
  color:#66655f;
  text-align:left;
  position:relative;
  z-index:5;
}

/* КАРТА */

#app.view-map{
  padding-left:5px;
  padding-right:5px;
}

.map-header{
  display:flex;
  align-items:center;
  gap:14px;
  margin:0 13px 28px;
}

.back{
  font-size:23px;
  width:44px;
  height:44px;
  text-align:left;
  color:#55544e;
}

.map-title{
  font-size:14px;
  overflow-wrap:anywhere;
  letter-spacing:.5px;
  text-shadow:0 0 1px rgba(40,40,35,.4);
}

.map-info{
  display:flex;
  justify-content:space-between;
  margin:0 13px 20px;
  font-size:12px;
  color:#85847c;
  letter-spacing:.7px;
}

#maps{
  display:flex;
  flex-direction:column;
  gap:32px;
  width:100%;
}

.map{
  width:100%;
  position:relative;
}

/* ТОНКАЯ ДЫМКА НАД КАРТОЙ */

.map:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 25% 35%,rgba(255,255,255,.16),transparent 55%),
    linear-gradient(110deg,rgba(255,255,255,.05),transparent 60%);
  opacity:.7;
}

.map svg{
  display:block;
  width:100%;
  height:auto;
  overflow:visible;
  touch-action:manipulation;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.45));
}

.cell{fill:transparent}
.cell.filled{fill:var(--cell)}

.outline{
  fill:none;
  stroke:#57564f;
  stroke-width:1.05;
  stroke-linejoin:miter;
  vector-effect:non-scaling-stroke;
}

.footer{
  margin:35px 13px 0;
  display:flex;
  justify-content:flex-end;
  gap:10px;
  font-size:12px;
  color:#77766f;
  letter-spacing:.7px;
}

button:active{opacity:.65}
</style>
</head>

<body>

<div id="app">

<section id="home">
  <div class="topline">
    <span>UNFOG</span>
    <span id="exerciseCount">00</span>
  </div>

  <div id="exerciseList"></div>

  <button class="add" id="addExercise" type="button">+</button>
</section>

<section id="workout" class="hidden">

  <div class="map-header">
    <button class="back" id="back" type="button">←</button>
    <span class="map-title" id="mapTitle"></span>
  </div>

  <div class="map-info">
    <span>MAP PROGRESS</span>
    <span id="mapPercent">0%</span>
  </div>

  <div id="maps"></div>

  <div class="footer">
    <span>REPS</span>
    <span id="totalReps">000</span>
  </div>

</section>
</div>

<script>
(() => {

const COLS=22;
const ROWS=28;
const CELL=18;

const W=COLS*CELL;
const H=ROWS*CELL;

const KEY="workout-map-v2";

const app=document.getElementById("app");
const home=document.getElementById("home");
const workout=document.getElementById("workout");
const list=document.getElementById("exerciseList");
const mapsEl=document.getElementById("maps");

let currentId=null;

let state={exercises:[]};


/* СЛУЧАЙНЫЕ ФОРМЫ ТЕРРИТОРИЙ */

function randomIsland(){

  const cells=[];
  const seed=Math.random()*10000;

  const mode=Math.floor(Math.random()*7);

  const cx=10.5;
  const cy=13.5;

  const angleSeed=Math.random()*Math.PI*2;

  // Случайные параметры формы

  const rx=mode===1?9.8:
           mode===2?6.5:
           mode===3?10.5:
           8.5+Math.random()*2;

  const ry=mode===1?5.5:
           mode===2?12:
           mode===3?8:
           8+Math.random()*3;

  const lobes=2+Math.floor(Math.random()*5);

  const waves=Array.from({length:6},()=>Math.random()*.17);

  function noise(x,y){
    return (
      Math.sin(x*.83+seed)*.08+
      Math.cos(y*.71-seed)*.07+
      Math.sin((x+y)*.39+seed*.3)*.06
    );
  }

  function inside(x,y){

    const dx=x-cx;
    const dy=y-cy;

    const angle=Math.atan2(dy/ry,dx/rx);
    const nx=dx/rx;
    const ny=dy/ry;

    const radius=Math.sqrt(nx*nx+ny*ny);

    const wave=
      waves[0]*Math.sin(angle*lobes+angleSeed)+
      waves[1]*Math.sin(angle*(lobes+2)+seed)+
      waves[2]*Math.cos(angle*7-seed)+
      waves[3]*Math.sin(angle*11+seed);

    let boundary=.82+wave;

    // Разветвлённая форма

    if(mode===4){
      boundary+=.16*Math.sin(angle*3+seed);
      boundary+=.10*Math.cos(angle*5-seed);
    }

    // Сильно вытянутая форма

    if(mode===1){
      boundary+=.12*Math.sin(angle*2+seed);
    }

    // Много отдельных бухт

    if(mode===5){
      boundary+=.22*Math.cos(angle*4+seed);
    }

    return radius<boundary+noise(x,y);
  }

  // Архипелаг из нескольких соединённых масс

  const blobs=[];

  if(mode===3 || mode===5){

    const count=3+Math.floor(Math.random()*4);

    for(let i=0;i<count;i++){
      blobs.push({
        x:cx+(Math.random()-.5)*11,
        y:cy+(Math.random()-.5)*19,
        rx:3+Math.random()*4,
        ry:3+Math.random()*5
      });
    }
  }

  // Основная генерация

  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){

      let yes=false;

      if(mode===3 || mode===5){

        for(const b of blobs){

          const dx=(x-b.x)/b.rx;
          const dy=(y-b.y)/b.ry;

          if(dx*dx+dy*dy<1+noise(x,y)){
            yes=true;
            break;
          }
        }

        // Перемычки между массами

        if(!yes && mode===3){
          yes=inside(x,y)&&Math.random()<.35;
        }

      }else{
        yes=inside(x,y);
      }

      // Дополнительные разрывы и бухты

      if(yes && Math.random()>.975){
        yes=false;
      }

      if(yes){
        cells.push([x,y,false]);
      }
    }
  }

  // Защита от слишком маленькой формы

  if(cells.length<35){
    return randomIsland();
  }

  return cells;
}


/* КОНТУР */

function makeOutline(cells){

  const set=new Set(cells.map(c=>`${c[0]},${c[1]}`));

  const has=(x,y)=>set.has(`${x},${y}`);

  const lines=[];

  for(const [x,y] of cells){

    const x1=x*CELL;
    const y1=y*CELL;
    const x2=x1+CELL;
    const y2=y1+CELL;

    if(!has(x,y-1)) lines.push(`M${x1} ${y1}H${x2}`);
    if(!has(x+1,y)) lines.push(`M${x2} ${y1}V${y2}`);
    if(!has(x,y+1)) lines.push(`M${x2} ${y2}H${x1}`);
    if(!has(x-1,y)) lines.push(`M${x1} ${y2}V${y1}`);
  }

  return lines.join("");
}


/* СОХРАНЕНИЕ */

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){
    console.log("Ошибка сохранения",e);
  }
}


/* ПРОГРЕСС */

function getProgress(exercise){

  const cells=exercise.maps.flatMap(m=>m.cells);

  if(!cells.length)return 0;

  const filled=cells.filter(c=>c[2]).length;

  return Math.floor(filled/cells.length*100);
}


/* ГЛАВНЫЙ ЭКРАН */

function renderHome(){

  list.replaceChildren();

  document.getElementById("exerciseCount").textContent=
    String(state.exercises.length).padStart(2,"0");

  state.exercises.forEach(exercise=>{

    const row=document.createElement("div");
    row.className="exercise";

    const name=document.createElement("button");
    name.className="exercise-name";
    name.type="button";
    name.textContent=exercise.name;
    name.onclick=()=>openExercise(exercise.id);

    const percent=document.createElement("span");
    percent.className="exercise-percent";
    percent.textContent=getProgress(exercise)+"%";

    const del=document.createElement("button");
    del.className="delete";
    del.type="button";
    del.textContent="×";

    del.onclick=()=>{

      if(!confirm("Удалить упражнение?"))return;

      state.exercises=state.exercises.filter(
        e=>e.id!==exercise.id
      );

      save();
      renderHome();
    };

    row.append(name,percent,del);
    list.appendChild(row);
  });
}


/* ДОБАВЛЕНИЕ */

document.getElementById("addExercise").onclick=()=>{

  const name=prompt("Название упражнения:");

  if(!name || !name.trim())return;

  state.exercises.push({
    id:Date.now().toString()+Math.random().toString(36).slice(2),
    name:name.trim(),
    reps:0,
    maps:[{cells:randomIsland()}]
  });

  save();
  renderHome();
};


/* ТЕКУЩЕЕ УПРАЖНЕНИЕ */

function getCurrent(){
  return state.exercises.find(e=>e.id===currentId);
}


/* ОТКРЫТИЕ */

function openExercise(id){

  currentId=id;

  const exercise=getCurrent();

  if(!exercise)return;

  home.classList.add("hidden");
  workout.classList.remove("hidden");
  app.classList.add("view-map");

  document.getElementById("mapTitle").textContent=exercise.name;

  renderWorkout();

  window.scrollTo(0,0);
}


/* НАЗАД */

document.getElementById("back").onclick=()=>{

  currentId=null;

  workout.classList.add("hidden");
  home.classList.remove("hidden");
  app.classList.remove("view-map");

  renderHome();

  window.scrollTo(0,0);
};


/* ОТРИСОВКА */

function renderWorkout(){

  const exercise=getCurrent();

  if(!exercise)return;

  mapsEl.replaceChildren();

  exercise.maps.forEach((map,mapIndex)=>{

    const section=document.createElement("div");
    section.className="map";

    const svg=document.createElementNS(
      "http://www.w3.org/2000/svg","svg"
    );

    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

    map.cells.forEach((cell,i)=>{

      const rect=document.createElementNS(
        "http://www.w3.org/2000/svg","rect"
      );

      rect.setAttribute("x",cell[0]*CELL);
      rect.setAttribute("y",cell[1]*CELL);
      rect.setAttribute("width",CELL);
      rect.setAttribute("height",CELL);

      rect.setAttribute("class",cell[2]?"cell filled":"cell");
      rect.dataset.cell=i;

      svg.appendChild(rect);
    });

    const outline=document.createElementNS(
      "http://www.w3.org/2000/svg","path"
    );

    outline.setAttribute("d",makeOutline(map.cells));
    outline.setAttribute("class","outline");

    svg.appendChild(outline);

    svg.addEventListener("pointerdown",event=>{

      const target=event.target.closest("[data-cell]");

      if(!target)return;

      event.preventDefault();

      addRep(mapIndex,Number(target.dataset.cell));
    });

    section.appendChild(svg);
    mapsEl.appendChild(section);
  });

  updateInfo();
}


/* ПОВТОРЕНИЯ */

function addRep(mapIndex,cellIndex){

  const exercise=getCurrent();

  if(!exercise)return;

  const map=exercise.maps[mapIndex];
  const cell=map?.cells[cellIndex];

  if(!cell)return;

  if(cell[2]){

    cell[2]=false;
    exercise.reps=Math.max(0,exercise.reps-1);

  }else{

    cell[2]=true;
    exercise.reps++;
  }

  const svg=mapsEl.children[mapIndex]?.querySelector("svg");

  const rect=svg?.querySelector(`[data-cell="${cellIndex}"]`);

  if(rect){
    rect.setAttribute(
      "class",
      cell[2]?"cell filled":"cell"
    );
  }

  const lastMap=exercise.maps[exercise.maps.length-1];

  if(
    lastMap.cells.every(c=>c[2]) &&
    mapIndex===exercise.maps.length-1
  ){

    exercise.maps.push({
      cells:randomIsland()
    });

    renderWorkout();
  }

  updateInfo();
  save();
}


/* ИНФОРМАЦИЯ */

function updateInfo(){

  const exercise=getCurrent();

  if(!exercise)return;

  document.getElementById("mapPercent").textContent=
    getProgress(exercise)+"%";

  document.getElementById("totalReps").textContent=
    String(exercise.reps).padStart(3,"0");

  save();
}


/* ЗАГРУЗКА */

try{

  const saved=JSON.parse(localStorage.getItem(KEY));

  if(saved && Array.isArray(saved.exercises)){
    state=saved;
  }

}catch(e){}


/* СТАРАЯ ВЕРСИЯ */

if(!state.exercises.length){

  try{

    const old=JSON.parse(localStorage.getItem("workout-map-v1"));

    if(old && Array.isArray(old.maps)){

      state.exercises.push({
        id:"old-workout",
        name:"Тренировка",
        reps:old.total||0,
        maps:old.maps
      });
    }

  }catch(e){}
}


/* ЗАПУСК */

renderHome();
save();

})();
</script>

</body>
</html>
